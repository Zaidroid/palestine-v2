[Unit]
# P3.1. The poller ran `active (running)` for 8 hours on 2026-08-01 with a dead
# transport. It now exits on an unrecoverable connection, so `Restart=` can do
# its job — and this makes the failure audible instead of merely logged.
OnFailure=palestine-v2-alert@%n.service

[Service]
# Exit 2 means the session is no longer authorised. Restarting cannot fix that
# and repeatedly reconnecting an unauthorised session is precisely the pattern
# that puts a fragile account at risk. Stop, and let the alarm carry it.
RestartPreventExitStatus=2
