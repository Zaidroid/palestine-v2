[Service]
# Without this, Python buffers stdout when it is not a TTY and the poller's
# output only reaches the journal when the process EXITS. A long-running
# service then looks silent whether it is healthy or wedged — and for the
# fragile agent2 account, "is it rate-limited right now" is exactly the
# question the log has to be able to answer.
Environment="PYTHONUNBUFFERED=1"
