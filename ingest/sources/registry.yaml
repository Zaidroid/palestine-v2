# P0.11 — declarative source registry.
#
# Every source MUST declare license + attribution + expect BEFORE it can run
# (framework.BaseFetcher refuses to construct otherwise). `commercial_use: false`
# sources are loop-only: they may score our accuracy, never appear in a response.
#
# status: active | planned | superseded — planned entries are contracts written
# ahead of code; superseded ones name what replaced them.
#
# WHAT THIS FILE GOVERNS TODAY (read 2026-09-25, not assumed). The contract is
# enforced only on BaseFetcher subclasses, and there is one: osm_fuel.py
# (`osm_fuel_stations`). Everything else runs outside it:
#   * the live Telegram tier — ingest/telegram_poller.py polls the channels named
#     in V2_TELEGRAM_CHANNELS (.env) and writes one `source` row per channel
#     (tg_<channel>, license NONE, commercial_use false, authority_rank 4);
#   * the RSS feeds — the FEEDS list in ingest/sources/rss_news.py;
#   * connectivity, fires, weather, power, fuel prices — ingest/sources/*.py,
#     each inserting its own `source` row;
#   * the databank — reviewed specs in db/mappings/*.yaml, loaded by
#     ingest/databank.py.
# For all of those the `source` table is the licence record of truth: the
# migrations that read publishers' terms (050, 053, 058, 063–067) write there,
# and the API serves from there. Where an entry below shares a key with a
# `source` row, its licence was corrected on 2026-09-25 to match that row, with
# the migration named; other values were left as written.
sources:

  # ── Live tier ─────────────────────────────────────────────────────────────
  - key: telegram_security
    name: Telegram security channels
    kind: telegram
    status: superseded         # by ingest/telegram_poller.py (one source row per
                               # channel, tg_<channel>); nothing reads this entry
    license: {spdx: NONE, commercial_use: false}
    attribution: "Telegram channel authors"
    authority_rank: 5
    cadence: continuous
    expect: {min_records: 1}
    note: >
      Fair-use ingestion of public channels. Raw text is NOT redistributable;
      derived events are. Treated as non-commercial until reviewed.

  - key: telegram_checkpoints
    name: Telegram roads/checkpoint channels
    kind: telegram
    status: superseded         # by ingest/telegram_poller.py, as above
    license: {spdx: NONE, commercial_use: false}
    attribution: "Telegram channel authors"
    authority_rank: 5
    cadence: continuous
    expect: {min_records: 1}

  - key: telegram_fuel
    name: Telegram fuel/commerce channels
    kind: telegram
    status: superseded         # by ingest/telegram_poller.py; fuel availability
                               # itself was retired 2026-09-23 (migration 070)
    license: {spdx: NONE, commercial_use: false}
    attribution: "Telegram channel authors"
    authority_rank: 5
    cadence: continuous
    expect: {min_records: 1}

  - key: gdelt_geo
    name: GDELT 2.0 GEO API
    kind: api
    status: planned            # Phase 4
    license: {spdx: CC-BY-4.0, commercial_use: true}
    attribution: "The GDELT Project"
    authority_rank: 2
    cadence: 15min
    expect: {min_records: 1, max_records: 50000}

  - key: nasa_firms
    name: NASA FIRMS VIIRS active fire
    kind: satellite
    status: active             # ingest/sources/fires.py, every 15 min via
                               # ops/ingest-external.sh once FIRMS_MAP_KEY is set;
                               # not a BaseFetcher, so this entry is not enforced
    # CC0-1.0 is what fires.py writes to its `source` row (`_ensure_source`).
    license: {spdx: CC0-1.0, commercial_use: true}
    attribution: "NASA FIRMS / LANCE"
    authority_rank: 3
    cadence: 12h
    allow_empty: true          # legitimately zero thermal anomalies in a window
    expect: {max_records: 20000}

  - key: nasa_black_marble
    name: NASA Black Marble VNP46 nighttime lights
    kind: satellite
    status: planned
    license: {spdx: NASA-Open, commercial_use: true}
    attribution: "NASA Black Marble / VIIRS Land Team"
    authority_rank: 3
    cadence: daily
    expect: {min_records: 1}

  - key: ioda
    name: IODA internet outage detection
    kind: api
    status: active             # ingest/sources/connectivity.py (every 15 min) and
                               # ops/fetch_ioda.py (nightly databank); neither is a
                               # BaseFetcher, so this entry is not enforced
    # Terms READ 2026-08-08 (migration 067): every IODA API response states "All
    # Rights Reserved". Not CC-BY; queryable with credit, excluded from bulk
    # export, and a letter (db/scout/letters/ioda.md) is the way to more.
    license: {spdx: LicenseRef-IODA-All-Rights-Reserved, commercial_use: false}
    attribution: "Internet outage detection: IODA, Georgia Tech Internet Intelligence Lab. Copyright (c) 2021-2025 Georgia Tech Research Corporation."
    authority_rank: 3
    cadence: hourly
    allow_empty: true          # no outage is the good case
    expect: {max_records: 10000}

  - key: cloudflare_radar
    name: Cloudflare Radar outages
    kind: api
    status: planned
    license: {spdx: PROPRIETARY-FREE-API, commercial_use: true}
    attribution: "Cloudflare Radar"
    authority_rank: 3
    cadence: hourly
    allow_empty: true
    expect: {max_records: 5000}

  # ── Reference / gazetteer ─────────────────────────────────────────────────
  - key: ocha_admin
    name: OCHA oPt administrative boundaries
    kind: file
    status: active             # P0.14
    license: {spdx: CC-BY-3.0-IGO, commercial_use: true}
    attribution: "UN OCHA oPt"
    authority_rank: 4
    cadence: yearly
    expect: {min_records: 10, max_records: 5000}

  - key: osm_places
    name: OpenStreetMap places (Overpass)
    kind: api
    status: active             # P0.15
    license: {spdx: ODbL-1.0, commercial_use: true}
    attribution: "© OpenStreetMap contributors"
    authority_rank: 2
    cadence: weekly
    expect: {min_records: 500, max_records: 100000}

  - key: osm_fuel_stations
    name: OpenStreetMap fuel stations (Overpass)
    kind: api
    status: active             # P1.3
    license: {spdx: ODbL-1.0, commercial_use: true}
    attribution: "© OpenStreetMap contributors"
    authority_rank: 2
    cadence: weekly
    expect: {min_records: 50, max_records: 5000}

  - key: v1_checkpoints
    name: v1 checkpoint registry (migration)
    kind: file
    status: active             # P0.16
    license: {spdx: NONE, commercial_use: true}
    attribution: "Palestine Data Backend v1"
    authority_rank: 3
    cadence: once
    expect: {min_records: 100, max_records: 2000}

  # ── Databank (Phase 2) ────────────────────────────────────────────────────
  - key: hdx_hapi
    name: HDX Humanitarian API
    kind: api
    status: planned
    license: {spdx: CC-BY-IGO-3.0, commercial_use: true}
    attribution: "UN OCHA Centre for Humanitarian Data"
    authority_rank: 4
    cadence: daily
    expect: {min_records: 1}

  - key: reliefweb
    name: ReliefWeb API
    kind: api
    status: planned
    # As recorded in `source` by migration 042; its terms have not been read
    # (terms_verified_at is NULL), so this is a label, not a licence.
    license: {spdx: metadata-free-with-attribution, commercial_use: true}
    attribution: "ReliefWeb / UN OCHA"
    authority_rank: 4
    cadence: hourly
    expect: {min_records: 1}

  - key: un_fts
    name: UN OCHA Financial Tracking Service
    kind: api
    status: planned
    license: {spdx: CC-BY-IGO-3.0, commercial_use: true}
    attribution: "UN OCHA FTS"
    authority_rank: 4
    cadence: daily
    expect: {min_records: 100}

  - key: worldbank
    name: World Bank Open Data
    kind: api
    status: planned
    license: {spdx: CC-BY-4.0, commercial_use: true}
    attribution: "World Bank Open Data"
    authority_rank: 4
    cadence: weekly
    expect: {min_records: 100}

  - key: wfp_food_prices
    name: WFP food prices (HDX)
    kind: api
    status: planned
    license: {spdx: CC-BY-IGO-3.0, commercial_use: true}
    attribution: "World Food Programme"
    authority_rank: 4
    cadence: monthly
    expect: {min_records: 1000}

  - key: tech4palestine
    name: Tech For Palestine datasets
    kind: api
    status: active             # ops/fetch_t4p.py nightly (ops/databank-sync.sh),
                               # loaded through db/mappings — not a BaseFetcher
    # Terms READ 2026-08-05 (migration 050): the repository LICENSE is the
    # Unlicense — public domain; credit is given by choice.
    license: {spdx: Unlicense, commercial_use: true}
    attribution: "Data: Tech4Palestine (data.techforpalestine.org), public domain (Unlicense); credited by choice."
    authority_rank: 3
    cadence: daily
    expect: {min_records: 100}

  # ── Loop B ground truth — NON-COMMERCIAL, never served ────────────────────
  - key: acled
    name: ACLED conflict events
    kind: api
    status: planned
    license: {spdx: ACLED-TOU, commercial_use: false}
    attribution: "Armed Conflict Location & Event Data Project (ACLED)"
    authority_rank: 4
    cadence: weekly
    expect: {min_records: 10}
    note: >
      LOOP B ONLY. Non-commercial terms. Used to score our own accuracy;
      must never appear in a served response. Enforced in SQL via
      source.commercial_use, not by convention.

  - key: btselem
    name: B'Tselem fatality database
    kind: file
    status: planned
    # Terms READ 2026-08-05 (migration 050): a bespoke licence STRICTER than
    # CC-BY-NC — bulk use "requires express written consent" — graded
    # no-redistribution (053); the bulk ask is the btselem_bulk letter.
    license: {spdx: LicenseRef-BTselem, commercial_use: false}
    attribution: "B'Tselem"
    authority_rank: 4
    cadence: monthly
    expect: {min_records: 100}

  - key: ocha_sitrep
    name: OCHA oPt Humanitarian Situation Updates
    kind: api
    status: planned
    license: {spdx: CC-BY-3.0-IGO, commercial_use: true}
    attribution: "UN OCHA oPt"
    authority_rank: 5
    cadence: 2x_weekly
    expect: {min_records: 1}
    note: No clean API — needs an HTML parser. Prime Loop B ground truth.
