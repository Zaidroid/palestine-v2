# Units — a reviewed document, loaded by ops/load_registry.py into unit_def
# and unit_alias. Measured from live rows on 2026-08-08: 45 distinct unit
# strings across 275,124 observations.
#
# THE PACK-SIZE PROBLEM is why this file exists. Twelve of those 45 strings
# are prices with a package baked in — ILS/KG, ILS/500 G, ILS/25 KG, ILS/2 KG,
# ILS/3 L, ILS/Cubic meter, ILS/L, ILS/60 KG, ILS/50 KG, ILS/2.5 KG,
# ILS/380 G, ILS/12 KG. A flour price per 25 kg and a rice price per kilo are
# both "a food price in shekels" and are not comparable numbers, and nothing
# in the databank said so.
#
# FACTORS ARE EXACT RATIONALS. canonical = value * factor_num / factor_den.
# 1000/380 and 1/12 and 1/3 do not terminate in decimal; writing 2.6315789
# puts a rounding error into every converted price forever. Same lesson as
# the identity renderer, where Python's 106.0 and SQL's 106 disagreed.
#
# An alias missing from this file is NOT an error and NOT silently dropped:
# v_observation_canonical leaves value_canonical NULL, and the loader counts
# how many rows are in that state.

units:
  persons:
    name_en: persons
    name_ar: أشخاص
    dimension: count
    notes: >-
      People. Distinct from `count` because a count of anything is not a
      count of people, and a correlation between "persons displaced" and
      "count of buildings" should not silently share a unit.
    aliases:
      persons: {}
      people: {}
      "Millions of people":
        factor_num: 1000000
      fatalities:
        note: >-
          A fatality count is a count of persons. The word carries the
          concept, not the unit; the concept lives in indicator_def.
      settlers: {note: persons, specifically settler population}
      thousand_persons:
        factor_num: 1000
        note: >-
          WHO GHO states some counts of people in thousands ("Number of
          children aged 6-59 months with anaemia (thousands)"). The row keeps
          WHO's number and this unit; the canonical value is persons.
      households:
        note: >-
          NOT persons. A household is a distinct unit and converting one to
          the other needs a household-size assumption we do not have.
        unit: households

  households:
    name_en: households
    name_ar: أسر
    dimension: count

  arrests:
    name_en: arrests
    name_ar: حالات اعتقال
    dimension: count
    notes: >-
      Arrests, not people: a person arrested twice counts twice (Addameer's
      running count since 7 October 2023, 2026-10-14).
    aliases:
      arrests: {}

  count:
    name_en: count
    name_ar: عدد
    dimension: count
    notes: >-
      A dimensionless count of things the indicator names. Deliberately
      broad: v1 used it for everything, and narrowing it per indicator is
      indicator_def's job, not this table's.
    aliases:
      count: {}
      number: {}
      units: {}
      buildings: {unit: structures}
      structures: {unit: structures}
      sites: {unit: sites}
      schools: {unit: facilities}
      attacks: {unit: events}
      vehicle: {unit: vehicles}
      tent: {unit: tents}
      box: {unit: packages}
      piece: {unit: packages}
      pallet: {unit: packages}
      truck: {unit: vehicles}
      incidents:
        unit: events
        note: Insecurity Insight's unit (20,174 rows served without an alias until 2026-10-12).
      cases:
        note: >-
          UNHCR counts some asylum applications and decisions as cases, and a
          case may hold several people. A count, never persons (231 rows).

  structures:  {name_en: structures,  name_ar: مبانٍ,   dimension: count}
  sites:       {name_en: sites,       name_ar: مواقع,   dimension: count}
  facilities:  {name_en: facilities,  name_ar: منشآت,   dimension: count}
  events:      {name_en: events,      name_ar: حوادث,   dimension: count}
  localities:  {name_en: localities,  name_ar: تجمّعات, dimension: count}
  km2:         {name_en: square kilometres, name_ar: كيلومتر مربع, dimension: area}
  vehicles:    {name_en: vehicles,    name_ar: مركبات,  dimension: count}
  tents:       {name_en: tents,       name_ar: خيام,    dimension: count}
  packages:
    name_en: packages
    name_ar: طرود
    dimension: count
    notes: >-
      Pallets, boxes and pieces are all "one consignment item" and the
      source uses them interchangeably. Kept as one unit with the original
      word preserved in attrs.unit_raw, because collapsing them loses
      nothing measurable and separating them implies a precision the
      consignment records do not have.

  tonne:
    name_en: tonnes
    name_ar: أطنان
    dimension: mass
    aliases:
      tonne: {}
      mt: {}

  percent:
    name_en: percent
    name_ar: نسبة مئوية
    dimension: ratio
    aliases:
      percentage: {}
      percent: {}
      per_100: {}
      # The IMF's own unit strings (2026-10-12: its 474 rows had no unit at
      # all). What the percent is OF is in the string and in the series' name;
      # the unit says only that it is a percentage.
      "Percent": {}
      "Percent of GDP": {}
      "Percent of World": {}
      "Annual percent change": {}
    notes: >-
      per_100 is percent by definition. per_1000 and per_100000 are NOT —
      they are their own rates and converting them here would change what
      the publisher said.

  per_1000:    {name_en: "per 1,000",   dimension: rate}
  per_100000:  {name_en: "per 100,000", dimension: rate}
  births_per_woman: {name_en: births per woman, dimension: rate}
  # World Population Prospects' own units for three indicators taken on
  # 2026-10-13 (db/mappings/population_wpp.yaml), as its indicator reference
  # words them. A sex ratio is males per 100 females, among the living or
  # among the born; it is not a percentage of anything and is never read as one.
  males_per_100_females:
    name_en: males per 100 females
    name_ar: ذكور لكل 100 أنثى
    dimension: ratio
  daughters_per_woman:
    name_en: surviving daughters per woman
    name_ar: بنات باقيات على قيد الحياة لكل امرأة
    dimension: rate
  ratio:       {name_en: ratio,       dimension: ratio}
  index:
    name_en: index
    dimension: index
    aliases:
      index: {}
      "Index": {}
  years:       {name_en: years,       name_ar: سنوات, dimension: time}
  km:          {name_en: kilometres,  name_ar: كيلومتر, dimension: length}

  # WHO GHO's own units (health.yaml, 2026-10-12). Each is what the indicator's
  # name or WHO's indicator metadata states; none is converted to another.
  per_10000:   {name_en: "per 10,000", dimension: rate}
  USD_per_capita:
    name_en: US dollars per person
    dimension: currency_per_capita
    aliases:
      "U.S. dollars per capita": {}
  # The IMF's purchasing-power-parity units: not US dollars, and never
  # converted to them.
  intl_dollars:
    name_en: international dollars (purchasing power parity)
    dimension: currency_ppp
    aliases:
      "Purchasing power parity; billions of international dollars":
        factor_num: 1000000000
  intl_dollars_per_capita:
    name_en: international dollars per person (purchasing power parity)
    dimension: currency_ppp_per_capita
    aliases:
      "Purchasing power parity; international dollars per capita": {}
  lcu_per_intl_dollar:
    name_en: national currency per international dollar
    dimension: exchange_rate
    aliases:
      "National currency per international dollar": {}
  dalys:
    name_en: disability-adjusted life years
    dimension: burden
    notes: >-
      DALYs: years of healthy life lost to death and to disability. A burden,
      not a count of people and not a span of time anyone lived.
  ug_per_m3:   {name_en: micrograms per cubic metre, dimension: concentration}
  g_per_100ml: {name_en: grams per 100 millilitres,  dimension: concentration}

  USD:
    name_en: US dollars
    name_ar: دولار أمريكي
    dimension: currency
    aliases:
      USD: {}
      currency_usd: {}
      "Billions of U.S. dollars":
        factor_num: 1000000000
      USD_millions:
        factor_num: 1000000
        note: >-
          WHO GHO SDG 6.a.1, "constant 2024 US$ millions". The price basis
          (constant 2024) is in the indicator's name, not in the unit.

  ILS_per_kg:
    name_en: shekels per kilogram
    name_ar: شيكل للكيلوغرام
    dimension: price_per_mass
    notes: >-
      The canonical food price. Every pack size below converts to it
      exactly, so two commodities can finally be compared.
    aliases:
      "ILS/KG":     {factor_num: 1,    factor_den: 1}
      "ILS/500 G":  {factor_num: 1000, factor_den: 500}
      "ILS/380 G":  {factor_num: 1000, factor_den: 380}
      "ILS/2 KG":   {factor_num: 1,    factor_den: 2}
      "ILS/2.5 KG": {factor_num: 1,    factor_den: 2.5}
      "ILS/12 KG":  {factor_num: 1,    factor_den: 12}
      "ILS/25 KG":  {factor_num: 1,    factor_den: 25}
      "ILS/50 KG":  {factor_num: 1,    factor_den: 50}
      "ILS/60 KG":  {factor_num: 1,    factor_den: 60}
      # The Gaza Chamber of Commerce's baby milk, by the 400 g can (2026-10-14).
      "ILS/400 G":  {factor_num: 1000, factor_den: 400}
      # The market channel's lists (2026-10-14): «3 كيلو بصل», «4 كيلو بطاطا», a pack of 800 g.
      "ILS/3 KG":   {factor_num: 1,    factor_den: 3}
      "ILS/4 KG":   {factor_num: 1,    factor_den: 4}
      "ILS/5 KG":   {factor_num: 1,    factor_den: 5}
      "ILS/10 KG":  {factor_num: 1,    factor_den: 10}
      "ILS/800 G":  {factor_num: 1000, factor_den: 800}

  ILS_per_piece:
    name_en: shekels per piece
    name_ar: شيكل للقطعة
    dimension: price_per_item
    notes: >-
      A price per counted item: a bar of soap, one diaper, one sanitary towel.
      The Gaza Chamber of Commerce prices diapers by the pack of 40 and
      sanitary towels by the pack of 10 (2026-10-14); each converts exactly.
      Never merged with a price per kilogram: a piece has no weight here.
    aliases:
      "ILS/PIECE":      {factor_num: 1, factor_den: 1}
      "ILS/10 PIECES":  {factor_num: 1, factor_den: 10}
      "ILS/40 PIECES":  {factor_num: 1, factor_den: 40}
      # A tray of eggs in the market channel's lists (2026-10-14): 30 to Gaza's tray.
      "ILS/30 PIECES":  {factor_num: 1, factor_den: 30}

  ILS_per_box:
    name_en: shekels per box
    name_ar: شيكل للصندوق
    dimension: price_per_item
    notes: >-
      The Gaza Chamber of Commerce's box of bottled water (2026-10-14): the
      reports price it by the box and never give the box's size, so it
      converts to nothing.
    aliases:
      "ILS/BOX": {factor_num: 1, factor_den: 1}

  ILS:
    name_en: Israeli new shekels
    name_ar: شيكل
    dimension: currency
    notes: >-
      An amount in shekels, at the prices of its date: the Gaza Chamber of
      Commerce's cost of its basket of essential goods (2026-10-14). Never
      converted to dollars here: the rate of a day in Gaza is not the bank's.
    aliases:
      ILS: {}
      NIS: {}

  ILS_per_litre:
    name_en: shekels per litre
    name_ar: شيكل لليتر
    dimension: price_per_volume
    notes: >-
      SEPARATE from ILS_per_kg on purpose. Converting a volume price to a
      mass price needs a density we do not have, and guessing one for
      cooking oil would be inventing data.
    aliases:
      "ILS/L":            {factor_num: 1, factor_den: 1}
      "ILS/3 L":          {factor_num: 1, factor_den: 3}
      "ILS/Cubic meter":  {factor_num: 1, factor_den: 1000}
