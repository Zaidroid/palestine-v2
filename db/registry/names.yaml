  # fao_diem.*: FAO's Data in Emergencies (DIEM) household surveys, one column of FAO's aggregated files per
  # indicator. Every name is FAO's own description of the column, shortened: "DIEM_2023_-_Fields_descriptions.xlsx",
  # the "column descriptions" file FAO links from the dataset's HDX page
  # (https://hqfao.maps.arcgis.com/sharing/rest/content/items/04287fcadb994341b0b70d19c8a02035/data, read 2026-10-12).
  # A share column is FAO's "percentage of households that, for question asked: '…', have answered: '…'":
  # the name is "<question, shortened>: <answer> (% of households, FAO DIEM)". Codes 888 and 999 are "don't know"
  # and "refused". A column that appears in more than one of the four files names its file.
  # The statistic columns (_wmean, _median, _stddev, _ci_low, _ci_high) are NOT percentages, whatever unit
  # their rows carry: household size in persons, income in the survey's currency, land in hectares. The age of
  # the head of household is named "as coded in the survey": Palestine's values are a band code (median 3 or 4).
  # "Reference year" and "this season" are FAO's own placeholders, set per country and round.
  # crp_saledif_competition_1 and crp_saledif_marketing_cost_1 follow FAO's MICRODATA sheet and its livestock
  # sheet (competition = market flooded with products; marketing_cost = high transport or marketing costs):
  # the aggregated crop sheet prints the two descriptions the other way round.
  # A CODED ANSWER IS NAMED ONLY WHERE THE ROWS HOLD TO FAO'S SHEET IN EVERY ROUND. Palestine has three rounds
  # (May 2024, July 2025, June-July 2026) and FAO publishes one sheet for all countries and rounds. Three
  # questions change their answer codes between rounds; the codes that cannot be told have no entry:
  # hh_education_4 and _5, ls_main_4 to _8, ls_salesmain_5 to _11 (14 columns).
  #
  # fao_diem.food_security.*: FAO's sheet "Food security" (179 columns)
