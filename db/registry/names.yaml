# Names for the databank's indicators.
#
# ops/load_registry.py names an indicator from, in this order: the spec rule
# that classifies it; `names:` below; the publisher's own name carried on the
# rows (attrs.indicator_name), with the dimension label after it. The Arabic
# for a publisher's name is looked up here by that English name.
#
#   names:            indicator key -> {en, ar}. For our own series and for
#                     publishers that give no name on the row.
#   publisher_names:  the publisher's English name, exactly as carried -> Arabic.
#   dimension_names:  a dimension label as carried ("Female") -> Arabic.
#
# Arabic here is the formal register of a label (the way a ministry or a UN
# table names a series), not the spoken register of an answer.
# A person killed by the occupation is شهيد; the roster's people are never
# counted with any other word.
#
# HOW A NAME IS WRITTEN (2026-10-12, the first filling of this file).
#   English: what is measured, its unit or basis where that is not obvious, and
#   the publisher in brackets. A running total says "cumulative" or "running
#   total", a daily figure says its period.
#   Arabic: Western digits; publishers in their usual Arabic form (أوتشا،
#   الأونروا، برنامج الأغذية العالمي، الفاو، وزارة الصحة في غزة، مفوضية
#   اللاجئين، السلام الآن، هموكيد، الضمير); Latin names with no settled Arabic
#   form stay Latin (Tech for Palestine, UCDP, ACLED, OONI, IODA, HDX,
#   Insecurity Insight, Good Shepherd Collective, Palestine Open Maps).
#   قتلى is used only for a publisher's neutral count that includes other
#   people (UCDP, ACLED).
#
# Nothing here says what a series measures beyond what its key, its rows, its
# spec and its publisher's documentation say. An indicator that could not be
# told from those has NO entry, on purpose (18 on 2026-10-12):
#   land.checkpoint               its 261 rows are sections of the Barrier
#   infrastructure.damage.unknown 0 on every row, type "unknown"
#   fao_diem …ls_proddif_888/_999 FAO's sheet gives the two codes the other
#                                 way round from every other question
#   fao_diem …hh_education_4/_5, ls_main_4 to _8, ls_salesmain_5 to _11
#                                 the answer codes change meaning between
#                                 survey rounds (see the notes beside the
#                                 fao_diem names) and FAO publishes one sheet

