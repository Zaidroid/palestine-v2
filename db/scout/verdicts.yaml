# The scout's reviewed memory — every verdict the project has already earned,
# so discovery never re-proposes a settled question. ops/source_scout.py
# reads this before surfacing anything; the weekly Opus maintenance run and
# Zaid are the only writers. A candidate leaves this file in exactly one of
# three ways: adopted (a reviewed spec exists), rejected (with the reason on
# the record), or debunked (measured not to exist / not to be what it claims).

adopted:
  # sources with reviewed specs and rows in the databank — never re-pitch
  tech4palestine: Unlicense (public domain, verified 2026-08-06); Gaza+WB
    casualties, roster, infra-until-2025-10
  ucdp: CC-BY-IGO; GED annual through 2024
  ocha_casualties: UN ToU personal-use-only — held, quarantined from
    commercial, annual
  ocha_demolitions: same terms; cumulative tables
  wfp: food prices, monthly
  unfts: funding flows, daily
  imf: annual macro
  worldbank: WDI annual
  who: GHO, 184 indicator codes incl. JMP WASH access (CC-BY-NC-SA-3.0-IGO)
  who_gho_wash: v2-native GHO fetch (open-defecation + expansion point)
  pcbs: CC-BY-4.0 verified 2026-08-06; aggregates only per Statistics Law
  pcbs_direct: same
  unrwa: aid trucks — DEAD upstream 2025-01-16
  unhcr: refugee stocks, annual
  idmc: displacement events (event-driven series)
  ioda: connectivity outages (CC-BY-NC)
  ooni: censorship measurements (stalled in v1 — fetcher never scheduled;
    revival is a one-line v1 fix awaiting Zaid)
  palopenmaps: ODbL-1.0 — share-alike obligations on derived databases
  addameer: monthly detention stats (no license found; org at addameer.ps)
  hamoked: detention stats (site fetch broken in v1)
  peace_now: settlements annual (no license statement found)
  unosat: Gaza damage assessments through 2025-10
  goodshepherd: Liberation License — revocable; held for serving, never
    commercial
  btselem: bespoke license; bulk use requires express written consent;
    exposure kept to 6 event rows
  gaza_moh: no license statement; consumed via T4P's public-domain
    compilation (tier-1 live telegram feed is separate machinery)
  acled: held raw via v1; ToU restrictive — serving posture unreviewed
  insecurity_insight: CC-BY-SA
  awsd: aid worker security DB
  fao_diem: FAO DIEM monitoring
  healthsites: global healthsites extract
  hdx_hapi: baseline HAPI pull
  reliefweb: report metadata only

debunked:
  ocha-hdx-mirror:
    measured: 2026-08-06
    finding: OCHA oPt's casualties and demolitions databases are NOT on HDX
      under any name, org, or topic query. The org's 33 datasets are
      boundaries/schools/barriers. Do not send anyone to look again;
      re-check only if OCHA announces an HDX publication.
  gho-wash-burden-pse:
    measured: 2026-08-06
    finding: WHO publishes NO WASH disease-burden estimates for PSE
      (WSH_1/3/10/20/30 series all empty at the GHO API).

rejected:
  goodshepherd-commercial:
    date: 2026-08-06
    reason: license is purpose-conditional AND revocable — can never anchor
      commercial serving
  btselem-bulk:
    date: 2026-08-06
    reason: bulk ingestion is "expansive use" requiring express written
      consent; revisit only by asking B'Tselem in writing

dead_upstream:
  unrwa-aid-trucks: {date: 2025-01-16, note: operational ban}
  t4p-infrastructure: {date: 2025-10-05, note: verified against live API
      2026-08-06; UNOSAT + unified infra carry the category}

# Org-level assessment watermarks: the mechanical sweep surfaces only
# datasets CREATED or MODIFIED after these dates for orgs already assessed.
assessed_orgs:
  ocha-opt: 2026-08-06        # all 33 datasets read during the HDX-mirror hunt

# Candidates under review land here (written by the maintenance run or by
# hand after reading a scout report). Full evidence for the deep sweep lives
# in db/scout/deep-2026-08-06/*.json — these are the reviewed one-liners.
candidates:
  # ── deep sweep 2026-08-06, infra/environment scout (12 found, all filed) ──
  ember_electricity:
    verdict: STRONG — the energy category's historical backbone
    what: 25y PSE generation/capacity/demand/net-imports/solar, annual
    license: CC-BY-4.0 (commercial), verified quote on file
    effort: low (one CSV, filter ISO3=PSE)
    trap: no WB/Gaza split; ends 2024
  nasa_black_marble:
    verdict: STRONG — the live "are the lights on" layer, public domain
    what: daily 500m nighttime radiance 2012→today; monthly composites for trend
    license: NASA public domain (commercial)
    effort: high (Earthdata token, HDF5, QA bands, FIRMS subtraction)
  rdna_2026:
    verdict: STRONG but NC — the authoritative post-2025-10 damage record
    what: WB/EU/UN final RDNA 2026-04; 17 sub-sectors, hard physical quantities
    license: attribution + NON-COMMERCIAL (quote on file)
    effort: high (PDF table extraction; re-key values, never reproduce tables)
    trap: point-in-time, not a series; IRDNA not comparable without adjustment
  climate_trace:
    verdict: GOOD — monthly-fresh asset-level energy/emissions proxy
    license: CC-BY (commercial); modelled estimates, carry confidence values
    trap: check East Jerusalem / Area C asset attribution before national totals
  insecurity_insight_water:
    verdict: GOOD — water-system attack events 2008→live, fills water's event side
    license: CC-BY-IGO 3.0 (commercial; arbitration clause — read before selling)
    effort: low
  wash_cluster_joint:
    verdict: GOOD — governorate WASH quantities with stated MoE, semi-annual
    license: CC-BY (commercial)
    trap: sample excludes worst-access areas — caveat must ride every figure
  unosat_fao_cropland:
    verdict: GOOD — cropland destruction geodata series 2024→2025-07
    license: CC-BY-SA (share-alike is viral on derived geodata)
  copernicus_fapar:
    verdict: GOOD — vegetation-stress baseline 2012→2026-07, WB+Gaza, updating
    license: CC-BY (commercial)
  unosat_roads:
    verdict: CHECK OVERLAP with held UNOSAT before speccing; CC-BY-SA;
      does not extend past 2025-10
  ookla_open_data:
    verdict: HOLD — quality-not-outage data, but CC-BY-NC-SA + Green Line
      clipping politics; revisit when connectivity category grows
  cloudflare_radar:
    verdict: HOLD — per-operator grain is unique; needs API token + CC-BY-NC;
      verify PS coverage with a token before committing
  peace_now_gis:
    verdict: BLOCKED on permission — no license stated anywhere (all rights
      reserved by default); written permission from Peace Now required
  # ── deep sweep 2026-08-06, UN/intergov scout (10 found, all filed) ────────
  un2720_aid:
    verdict: STRONG — THE live successor to the dead UNRWA aid-truck series
    what: daily Gaza aid verification since 2025-05-21 (trucks/pallets/tonnes
      delivered + looted, by org and category); verified 368 days pulled
    license: UN ToU floor (personal/non-commercial) — same posture as OCHA;
      serve-with-attribution, never commercial
    effort: low, BUT undocumented dashboard endpoints — snapshot daily, diff
      snapshots (date params silently ignored)
  unsd_energy:
    verdict: STRONG — energy backbone 1990-2024, OPEN attribution-only
    what: 4,567 verified observations, full commodity balances incl. imports
    license: UNdata ToU "may be copied freely ... provided UNdata is cited"
      (commercial YES) — pairs with Ember (2000-2024) and Black Marble (live)
    trap: numeric M49 code 275 only; opaque codelists; UNIT_MULT
  ipc_food_severity:
    verdict: STRONG — CC0 public domain, subnational famine phases,
      2023-11→2026-07, admin2 grain; enriches food immediately
    trap: filter ipc_type + admin_level or you multi-count
  ilostat_quarterly:
    verdict: GOOD — CC-BY-4.0 quarterly labour through 2025-Q1
    trap: MUST carry "Excluding Gaza Strip" note on every post-2023 row
  unesco_uis:
    verdict: GOOD — education category + 1970-1999 era fill, 38k observations
    license: CC-BY-SA-4.0 (share-alike on derived tables)
  wpp_demographics:
    verdict: GOOD for the 1950-1966 era hole — the only annual numbers found
    trap: modelled back-cast, label as estimates; license unclear (UN ToU
      floor) → treat non-commercial until read
  un_comtrade:
    verdict: HOLD — trade data verified real but re-dissemination restricted
      to paid subscribers per policy; licence unreadable at source. Ask
      before any ingest.
  unicef_sdmx:
    verdict: HOLD — licence pages 403 programmatic clients; needs a manual
      browser read; heavy overlap with held WHO/UIS/WPP (dedupe on
      DATA_SOURCE)
  un_sdg_api:
    verdict: LOW — republication layer over agencies already held; only
      disaster-risk/governance series new
  rdna_2026_corroborated:
    verdict: (see rdna_2026 above) — independently found by both scouts;
      infra scout successfully parsed the PDF tables with pdftotext
