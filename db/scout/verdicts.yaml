# The scout's reviewed memory — every verdict the project has already earned,
# so discovery never re-proposes a settled question. ops/source_scout.py
# reads this before surfacing anything; the weekly Opus maintenance run and
# Zaid are the only writers. A candidate leaves this file in exactly one of
# three ways: adopted (a reviewed spec exists), rejected (with the reason on
# the record), or debunked (measured not to exist / not to be what it claims).

adopted:
  # sources with reviewed specs and rows in the databank — never re-pitch
  tech4palestine: >-
    Unlicense (public domain, verified 2026-08-06); Gaza+WB
    casualties, roster, infra-until-2025-10
  ucdp: CC-BY-IGO; GED annual through 2024
  ocha_casualties: >-
    UN ToU personal-use-only — held, quarantined from
    commercial, annual
  ocha_demolitions: same terms; cumulative tables
  wfp: food prices, monthly
  unfts: funding flows, daily
  imf: annual macro
  worldbank: WDI annual
  who: GHO, 184 indicator codes incl. JMP WASH access (CC-BY-NC-SA-3.0-IGO)
  who_gho_wash: v2-native GHO fetch (open-defecation + expansion point)
  pcbs: CC-BY-4.0 verified 2026-08-06; aggregates only per Statistics Law
  pcbs_direct: same
  unrwa: aid trucks — DEAD upstream 2025-01-16
  unhcr: refugee stocks, annual
  idmc: displacement events (event-driven series)
  ioda: connectivity outages (CC-BY-NC)
  ooni: >-
    censorship measurements (stalled in v1 — fetcher never scheduled;
    revival is a one-line v1 fix awaiting Zaid)
  palopenmaps: ODbL-1.0 — share-alike obligations on derived databases
  addameer: monthly detention stats (no license found; org at addameer.ps)
  hamoked: detention stats (site fetch broken in v1)
  peace_now: settlements annual (no license statement found)
  unosat: Gaza damage assessments through 2025-10
  goodshepherd: >-
    Liberation License — revocable; held for serving, never
    commercial
  btselem: >-
    bespoke license; bulk use requires express written consent;
    exposure kept to 6 event rows
  gaza_moh: >-
    no license statement; consumed via T4P's public-domain
    compilation (tier-1 live telegram feed is separate machinery)
  acled: held raw via v1; ToU restrictive — serving posture unreviewed
  insecurity_insight: CC-BY-SA
  awsd: aid worker security DB
  fao_diem: FAO DIEM monitoring
  healthsites: global healthsites extract
  hdx_hapi: baseline HAPI pull
  reliefweb: report metadata only

debunked:
  gdelt:
    measured: 2026-08-07
    finding: >-
      measured negative on a live slice — zero Gaza/WB events, 5/9
      Israel rows country-centroid, unrelated foreign stories coded as
      military force INSIDE Gaza's coordinates. A media-attention signal,
      not a conflict record. Do not re-propose.
  unrwa-escalations-key-figures:
    measured: 2026-08-07
    finding: >-
      the HDX resource is HTTP 410 Gone; advertised coverage ended
      2024-03 anyway. Surfaces near the top of every HDX casualties search —
      that is why it is filed. General trap it teaches — HDX last_modified
      reflects metadata touches, not data reality; fetch before believing.
  ocha-hdx-mirror:
    measured: 2026-08-06
    finding: >-
      OCHA oPt's casualties and demolitions databases are NOT on HDX
      under any name, org, or topic query. The org's 33 datasets are
      boundaries/schools/barriers. Do not send anyone to look again;
      re-check only if OCHA announces an HDX publication.
  gho-wash-burden-pse:
    measured: 2026-08-06
    finding: >-
      WHO publishes NO WASH disease-burden estimates for PSE
      (WSH_1/3/10/20/30 series all empty at the GHO API).

rejected:
  acled-serving:
    date: 2026-08-07
    reason: >-
      EULA read at source — no direct access to Licensed Content;
      reorganizing or dashboarding is explicitly insufficient; building a
      functional substitute prohibited; ML/AI use prohibited regardless of
      intent. ACLED must never be served from the databank in any form.
      v2 verified ZERO acled rows same day. [ZAID] v1 fetches acled-pse
      nightly and serves its own site — compliance flag for v1. Only route
      to serving is a paid corporate license.
  goodshepherd-commercial:
    date: 2026-08-06
    reason: >-
      license is purpose-conditional AND revocable — can never anchor
      commercial serving
  btselem-bulk:
    date: 2026-08-06
    reason: >-
      bulk ingestion is "expansive use" requiring express written
      consent; revisit only by asking B'Tselem in writing

dead_upstream:
  unrwa-aid-trucks: {date: 2025-01-16, note: operational ban}
  t4p-infrastructure: {date: 2025-10-05, note: verified against live API
      2026-08-06; UNOSAT + unified infra carry the category}

# Org-level assessment watermarks: the mechanical sweep surfaces only
# datasets CREATED or MODIFIED after these dates for orgs already assessed.
assessed_orgs:
  ocha-opt: 2026-08-06        # all 33 datasets read during the HDX-mirror hunt

# Candidates under review land here (written by the maintenance run or by
# hand after reading a scout report). Full evidence for the deep sweep lives
# in db/scout/deep-2026-08-06/*.json — these are the reviewed one-liners.
candidates:
  # ── deep sweep 2026-08-06, infra/environment scout (12 found, all filed) ──
  ember_electricity:
    verdict: STRONG — the energy category's historical backbone
    what: 25y PSE generation/capacity/demand/net-imports/solar, annual
    license: CC-BY-4.0 (commercial), verified quote on file
    effort: low (one CSV, filter ISO3=PSE)
    trap: no WB/Gaza split; ends 2024
  nasa_black_marble:
    verdict: STRONG — the live "are the lights on" layer, public domain
    what: daily 500m nighttime radiance 2012→today; monthly composites for trend
    license: NASA public domain (commercial)
    effort: high (Earthdata token, HDF5, QA bands, FIRMS subtraction)
  rdna_2026:
    verdict: STRONG but NC — the authoritative post-2025-10 damage record
    what: WB/EU/UN final RDNA 2026-04; 17 sub-sectors, hard physical quantities
    license: attribution + NON-COMMERCIAL (quote on file)
    effort: high (PDF table extraction; re-key values, never reproduce tables)
    trap: point-in-time, not a series; IRDNA not comparable without adjustment
  climate_trace:
    verdict: GOOD — monthly-fresh asset-level energy/emissions proxy
    license: CC-BY (commercial); modelled estimates, carry confidence values
    trap: check East Jerusalem / Area C asset attribution before national totals
  insecurity_insight_water:
    verdict: GOOD — water-system attack events 2008→live, fills water's event side
    license: CC-BY-IGO 3.0 (commercial; arbitration clause — read before selling)
    effort: low
  wash_cluster_joint:
    verdict: GOOD — governorate WASH quantities with stated MoE, semi-annual
    license: CC-BY (commercial)
    trap: sample excludes worst-access areas — caveat must ride every figure
  unosat_fao_cropland:
    verdict: GOOD — cropland destruction geodata series 2024→2025-07
    license: CC-BY-SA (share-alike is viral on derived geodata)
  copernicus_fapar:
    verdict: GOOD — vegetation-stress baseline 2012→2026-07, WB+Gaza, updating
    license: CC-BY (commercial)
  unosat_roads:
    verdict: >-
      CHECK OVERLAP with held UNOSAT before speccing; CC-BY-SA;
      does not extend past 2025-10
  ookla_open_data:
    verdict: >-
      HOLD — quality-not-outage data, but CC-BY-NC-SA + Green Line
      clipping politics; revisit when connectivity category grows
  cloudflare_radar:
    verdict: >-
      HOLD — per-operator grain is unique; needs API token + CC-BY-NC;
      verify PS coverage with a token before committing
  peace_now_gis:
    verdict: >-
      BLOCKED on permission — no license stated anywhere (all rights
      reserved by default); written permission from Peace Now required
  # ── deep sweep 2026-08-06, UN/intergov scout (10 found, all filed) ────────
  un2720_aid:
    verdict: STRONG — THE live successor to the dead UNRWA aid-truck series
    what: >-
      daily Gaza aid verification since 2025-05-21 (trucks/pallets/tonnes
      delivered + looted, by org and category); verified 368 days pulled
    license: >-
      UN ToU floor (personal/non-commercial) — same posture as OCHA;
      serve-with-attribution, never commercial
    effort: >-
      low, BUT undocumented dashboard endpoints — snapshot daily, diff
      snapshots (date params silently ignored)
  unsd_energy:
    verdict: STRONG — energy backbone 1990-2024, OPEN attribution-only
    what: 4,567 verified observations, full commodity balances incl. imports
    license: >-
      UNdata ToU "may be copied freely ... provided UNdata is cited"
      (commercial YES) — pairs with Ember (2000-2024) and Black Marble (live)
    trap: numeric M49 code 275 only; opaque codelists; UNIT_MULT
  ipc_food_severity:
    verdict: >-
      STRONG — CC0 public domain, subnational famine phases,
      2023-11→2026-07, admin2 grain; enriches food immediately
    trap: filter ipc_type + admin_level or you multi-count
  ilostat_quarterly:
    verdict: GOOD — CC-BY-4.0 quarterly labour through 2025-Q1
    trap: MUST carry "Excluding Gaza Strip" note on every post-2023 row
  unesco_uis:
    verdict: GOOD — education category + 1970-1999 era fill, 38k observations
    license: CC-BY-SA-4.0 (share-alike on derived tables)
  wpp_demographics:
    verdict: GOOD for the 1950-1966 era hole — the only annual numbers found
    trap: >-
      modelled back-cast, label as estimates; license unclear (UN ToU
      floor) → treat non-commercial until read
  un_comtrade:
    verdict: >-
      HOLD — trade data verified real but re-dissemination restricted
      to paid subscribers per policy; licence unreadable at source. Ask
      before any ingest.
  unicef_sdmx:
    verdict: >-
      HOLD — licence pages 403 programmatic clients; needs a manual
      browser read; heavy overlap with held WHO/UIS/WPP (dedupe on
      DATA_SOURCE)
  un_sdg_api:
    verdict: >-
      LOW — republication layer over agencies already held; only
      disaster-risk/governance series new
  rdna_2026_corroborated:
    verdict: >-
      (see rdna_2026 above) — independently found by both scouts;
      infra scout successfully parsed the PDF tables with pdftotext
  # ── deep sweep 2026-08-06/07, conflict scout (10 filed) ───────────────────
  ucdp_ged_v261:
    verdict: >-
      STRONG, do first — version bump adds ALL of 2025 (3,190 events,
      14,563 deaths, Gaza 3,055); identical schema, held license, one file
      swap. RE-LOAD not append (ids/estimates revised between versions).
  ucdp_candidate_monthly:
    verdict: >-
      STRONG — monthly GED kills the annual lag; CC-BY-4.0 verified;
      2026-01→06 already downloadable. Provisional rows (code_status) must
      carry their status and be reconciled on each annual release.
  masafer_yatta_violence:
    verdict: >-
      GOOD — open incident-grained settler violence with the police-
      response dimension held nowhere else; narrow (South Hebron Hills, one
      year); dedupe on id_event; never present as WB-wide.
  pcbs_education_violations:
    verdict: >-
      GOOD — CC-BY cumulative as-of snapshots = exactly our
      sys_period shape; PCBS as casualty authority; snapshot the Google
      Sheet on ingest.
  insecurity_explosive_weapons:
    verdict: >-
      CHECK — 6,743 PSE incidents CC-BY-SA, but verify (a) overlap
      with held II ingest, (b) whether PSE coordinates are 'censored'
      (observed literal token); re-parse with a real xlsx reader first.
  airwars:
    verdict: >-
      BLOCKED on license — NO statement anywhere (checked
      exhaustively); the richest strike-level record of the war otherwise.
      Ask Airwars in writing; ingest = parsing ~2,700 HTML pages (API is a
      partial mirror with emptied Gaza fields).
  cpj_journalists:
    verdict: >-
      BLOCKED by NoDerivatives — reshaping into our schema is a
      derivative work; NC too. Written permission, or internal
      cross-checking only, never serving.
  # ── deep sweep 2026-08-07, Palestinian-institutions scout (10 filed) ──────
  pwa_water:
    verdict: >-
      STRATEGIC — the ONLY affirmative data-reuse grant found from any
      Palestinian institution (attribution-with-link, no commercial bar), and
      the authoritative source for the 39%-purchased-from-Israel share. But
      the data is published as BITMAPS and carries NO reference year — write
      to PWA for the year before ingesting anything as a time series.
  perc_electricity:
    verdict: >-
      STRONG content, license-limited — best-structured Palestinian
      electricity data (consumers, renewables, SAIDI/SAIFI, tariffs, debt,
      2015-2024, per distribution company). Bare all-rights-reserved →
      ingest extracted FACTS with attribution, never republish tables.
      TLS: valid leaf, mismatched intermediate — pin the leaf, never
      blanket-disable verification.
  wsrc_water_providers:
    verdict: >-
      STRONG content, no license — ~150 providers, real m3/NRW/tariff/
      collection-efficiency data. Gaza absent from 2024 (WSRC says it could
      not collect). Mixed reference years inside one edition — never assume
      the cover year. No terms anywhere; ask.
  pcbs_press_releases:
    verdict: >-
      GOOD — sub-annual CPI + quarterly LFS under the SAME CC-BY-4.0
      already verified for PCBS; no new license work. NEGATIVE FINDING
      recorded - PCBS PXWeb API is DEAD (all documented paths 404).
  pchr_archive:
    verdict: >-
      BLOCKED on permission — 11,777 posts, 30 years, real REST API,
      but the terms page is an EMPTY STUB (advertised, never written) and no
      structured tables exist anywhere. Ask PCHR in writing.
  mezan:
    verdict: >-
      BLOCKED + STALE — demographic breakdowns held nowhere else, but
      statistics froze March 2023 and the named archive covers only 2014;
      terms-of-service page is a live placeholder titled 'test'.
  jdeco:
    verdict: >-
      BLOCKED, hardest license in the set — expressly forbids copying
      or distributing any content without prior written permission. Valuable
      (East Jerusalem coverage, 2011-2024); derived facts with attribution at
      most, or ask.
  dcip_children:
    verdict: >-
      UNVERIFIED — pages and license confirmed, but zero figures in
      served HTML (client-rendered, no API). Needs a headless-browser pass
      before it can be judged. All-rights-reserved.
  moh_ramallah:
    verdict: >-
      UNVERIFIED, one fetch away — the only candidate for the WEST
      BANK health-system gap. Critical dedup: its Gaza page is the same
      upstream already held via T4P.
  pma_monetary:
    verdict: >-
      LEAD ONLY — DO NOT PURSUE AS SCOUTED. The scout reached PMA's
      backend by extracting an API key from the site's JS bundle and
      enumerating the database schema. That is credential-derived
      reconnaissance, not public-page scraping, and this project does not
      acquire data that way (policy set 2026-08-07). If pursued - rendered
      public pages/PDFs, or write to PMA. No license established either way.

# METHOD LAW for every future scout (set 2026-08-07 after the PMA finding):
# read what a browser would render and what a publisher chose to publish.
# Never extract credentials from client bundles, never enumerate a backend,
# never authenticate as a site's own frontend. A source we cannot reach
# honestly is a source we ask for or do without.
