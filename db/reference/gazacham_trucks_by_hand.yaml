# Trucks into Gaza, by week, as the Gaza Chamber of Commerce's weekly reports state them,
# for the weeks whose figures are in sentences and not in the regular table (weeks 32 to 50,
# and 55). Read by hand on 2026-10-14 from the report text in the archive
# (data/raw/reports/gazacham/items-all.ndjson.gz; source org:gazacham). Every figure below is
# the report's own; `quote` is the sentence it stands on; nothing is derived.
#
# The other weeks (1 to 31, 51 to 111 except 55) are read from the reports' tables by
# ops/build_gazacham_series.py. Week 42 (13 to 19 May 2025) states no figure for the week:
# its report gives the trucks "since the resumption ... up till the date of this report",
# a span that is not the week, and the week is left without a value.
weeks:
