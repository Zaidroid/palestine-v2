# Figures cited from named publications, entered by hand.
#
# WHY (2026-10-12). «العدّ / The Count» shows figures that no row in the
# databank stood behind: they were typed into the film. A typed number has no
# source a reader can open, no date, and no way to be corrected in one place.
# Each figure here is ONE publisher's statement: who says it, in which
# document, where to read it, and the sentence itself where it was copied.
# Several publishers on one question are several rows, never an average.
#
# verification:
#   read            the sentence was seen in the publisher's own text
#   via_wikipedia   seen on Wikipedia only; the source it names was not opened
#   secondary       seen in a report about the publisher's statement
# A row with no `quote` records what the research note says the source says;
# the wording is the note's, not the publisher's.
#
# read_on is the day the source was read (default below).
# Fields: id (never reused), topic, measure, date, precision, value (or low/
# high for a range), qualifier (about | at_least | more_than | up_to), unit,
# region, publisher, document, url, quote, verification, caution.
# `from`/`to` name a period; the row is then one total for it.
#
# ops/build_cited_figures.py checks this file and writes the loader's input.
# Sources of the first set: the research file of 2026-10-07 for stories 8 and 9
# (a research agent's reading through `reach`, filed with each figure's tag),
# and the readings of 2026-10-12 for the figures typed into stories 2 to 7.

# Applied to an entry that does not say otherwise.
defaults:
  read_on: "2026-10-07"      # the research for «العدّ» stories 8 and 9

figures:

