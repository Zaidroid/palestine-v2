- {id: gaza-blockade-2025-first-trucks, topic: gaza_blockade_2025, measure: ended, date: "2025-05-19", precision: day,
   statement: "the first aid trucks were cleared to enter after 11 weeks of complete blockade", unit: events, region: "Gaza Strip", read_on: "2026-10-12",
   publisher: "UN OCHA (the Emergency Relief Coordinator)", document: "UN Relief Chief welcomes renewed aid deliveries to Gaza (19 May 2025)",
   url: "https://www.unocha.org/publications/report/occupied-palestinian-territory/un-relief-chief-welcomes-renewed-aid-deliveries-gaza-stresses-its-only-drop-ocean-what-needed-enhe",
   quote: "The Israeli authorities have temporarily allowed us to resume delivery of limited aid into Gaza, following 11 weeks of complete blockade, and amid a spike in the military offensive.",
   verification: read,
