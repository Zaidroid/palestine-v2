# JOB-06, the figures lake: Claude's re-read of DeepSeek's ten pilot series
# (2026-10-20). DeepSeek read 343 candidates against their quotes and kept
# them when "figure and subject match the family". That is a looser bar than
# a series needs: a sentence about trees is not a row of trees uprooted, a
# repeated citation of one half-year report is not six data points, and
# "5.283 دونم" is five dunums, not five thousand. This file is the second
# read, row by row, and the only thing ops/load_job_returns.py loads: a
# document that is not listed here is not loaded. The quote, the URL and the
# date come from DeepSeek's reviewed files (data/raw/jobs/06/reviewed/).
#
# Verdicts: the ten series split four ways.
#   loaded as series   trees (incidents + the authorities' tallies), land
#                      seizure orders, the Gaza aid-truck compliance series,
#                      cooking-gas shipments
#   cited figures      unemployment, Rafah/crossings, hospital beds, iron
#                      gates (db/reference/cited_figures.yaml, section I):
#                      statements with a publisher, not a series
#   not loaded         displaced (mixed subjects), power plant (anecdotes;
#                      the rota and OCHA's daily table already cover it)
#
# Dot as a decimal in land orders: Palestinian military orders print
# "7.498 دونم" for 7 dunums and 498 m². DeepSeek's lake read 5283 at Jaba'
# and 137,500 at Jayyous; both are misparses (5.283 and, by the other
# outlet, 160). Dot as a thousands separator in WAFA's tallies: "26.395"
# is 26,395; DeepSeek's self-check caught that one.

reviewed_on: "2026-10-20"
reader: "JOB-06 lake (DeepSeek) + Claude re-read 2026-10-20"

