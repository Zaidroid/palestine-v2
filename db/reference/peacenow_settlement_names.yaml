# The name of each Peace Now settlement series, in English and Arabic.
#
# Every settlement in Peace Now's list that has at least one population figure
# is its own series, settlements.population_by_settlement.pn<DB_ID> (four
# digits; db/mappings/settlements_by_settlement.yaml). This is the file a
# person edits to name one. ops/build_settlement_names.py checks it and writes
# the names into db/registry/names.yaml, where the registry loader reads them:
#
#   .venv/bin/python -m ops.build_settlement_names           # check and write
#   .venv/bin/python -m ops.build_settlement_names --check   # check only
#
# THE RULE (one for all of them, held by tests/test_more_settlements.py):
#   English   Population of the Israeli settlement of <name>, West Bank (Peace Now)
#   Arabic    عدد سكان مستوطنة <ar> في الضفة الغربية (السلام الآن)
# <name> is the sheet's "Name" exactly as Peace Now writes it (read
# 2026-10-13). None of the 141 names had a typing slip in its capitals, so
# none was changed (the slips in that sheet are in other columns).
#
# WHERE THE ARABIC COMES FROM. A name is a transliteration either way; the
# question is whose. The spelling a Palestinian or Arabic source PRINTS is
# used wherever one was found, and `from` says which (read 2026-10-13):
#
#   arij          ARIJ (Applied Research Institute - Jerusalem), «قاعدة بيانات
#                 للمستوطنات الإسرائيلية في الضفة الغربية المحتلة 1967-2022»,
#                 March 2023: 199 settlements by governorate, each with its
#                 English and Arabic name.
#                 https://www.arij.org/wp-content/uploads/2023/03/Israeli-Settlements-Database-1967-2022.pdf
#                 Two things are done to ARIJ's letters and nothing else:
#                 (1) `printed` is given where ARIJ leaves an opening alef
#                 bare and the name here writes its hamza (ادورا -> أدورا,
#                 افرات -> إفرات: أ before a, o, u and إ before e, i, by the
#                 sheet's own English spelling). 25 names.
#                 (2) the PDF's text layer reverses lam-alef (رام هللا for
#                 رام الله); the three names it touches were read off the
#                 page image (حلاميش، ميهولا، شدموت ميهولا).
#                 Where ARIJ prints two names for one settlement, the one the
#                 sheet uses is taken and `note` quotes ARIJ in full.
#   arwiki        the title of the settlement's own Arabic Wikipedia article
#                 (ARIJ does not list it). 3 names.
#   arwiki_list   Arabic Wikipedia, «قائمة المستوطنات الإسرائيلية». 1 name.
#   ips           Institute for Palestine Studies, «توثيق استهداف الضفة
#                 الغربية», the settlement's page
#                 (documentwestbank.palestine-studies.org/ar/node/9410). 1 name.
#   watan         Dunia Al-Watan, 2018-10-06, the weekly settlement report of
#                 the National Bureau for Defending Land
#                 (alwatanvoice.com/arabic/news/2018/10/06/1179953.html). 1 name.
#   city          the Arabic name of the Palestinian city the sheet's row is
#                 inside (Hebron). 1 name.
#   transliterated  NO printed spelling was found. Written from the Hebrew by
#                 the convention ARIJ's own names follow. 1 name. MARKED so it
#                 can be replaced the day a source prints it.
#
# What was looked for and not found: the Palestinian Central Bureau of
# Statistics' yearly report («المستعمرات الإسرائيلية في الضفة الغربية، التقرير
# الإحصائي السنوي 2024», November 2025) prints 24 tables by governorate and
# type and no list of settlements by name; its settlements database is
# "بيانات غير منشورة" (unpublished).
#
# Arabic sources do not agree with each other on these names (Ariel is أريئيل
# in ARIJ and أرئيل as an Arabic Wikipedia title; Eli is ايلي in ARIJ and عيلي
# in Arabic Wikipedia). One source was followed so that the list is one
# hand's spelling; a name Zaid would write differently is changed here, in
# `ar`, and nowhere else.
#
# No Arabic "meaning" is given to any name: these are spellings, not
# translations.
#
# A settlement that gains its first figure later has no entry here. Its rows
# still load and are classified; the fetcher names it in its output and its
# ledger line (`unnamed`) until an entry is added.
rule:
  en: "Population of the Israeli settlement of {name}, West Bank (Peace Now)"
  ar: "عدد سكان مستوطنة {ar} في الضفة الغربية (السلام الآن)"

# `whole` on an entry replaces the rule's sentence for that one series. One
# entry has it: Hebron, where the rule would call the city itself a settlement
# («مستوطنة الخليل»). The row is the settlers inside the city.
