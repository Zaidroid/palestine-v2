      serve_warning_ar: "هاد سعر السلعة زي ما نشرته قناة تلغرام «أسعار السوق - غزة» (@asarsook) لهداك اليوم: سعر قائمة وحدة، مش معدّل ولا مسح، والقناة ما بتحكي كيف بتجمع الأسعار. القائمة ما ذكرت منطقة: ممكن تكون أي سوق بالقطاع. القائمة مأرّخة باليوم اللي مكتوب فيها، وإذا ما في تاريخ فبيوم المنشور بغزة. ولما القائمة ما تكتب وحدة، السعر للكيلو، لأنه هيك بتنباع الخضرة واللحمة والسمك بهالقوائم (والسطر بيقول من وين أخدنا الوحدة)؛ والسعر اللي مكتوب كمدى (من لـ) محطوط نصّه، والطرفين جنبه؛ وإذا في سعر ثاني بنفس اليوم بيكون جنب الرقم. وهاد مش معدّل الغرفة التجارية الأسبوعي ولا سعر برنامج الأغذية الشهري، وما بنحطهم بسلسلة وحدة. هاد السعر بالدفع بالتطبيق (تحويل بنكي): لما كان الكاش قليل، البيّاعين كانوا ياخدوا أكثر بالتطبيق من الكاش؛ والسعر اللي ما إله علامة دفع إله سلسلة لحاله."
