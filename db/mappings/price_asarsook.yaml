      serve_warning: "The price of this good as the Telegram channel «أسعار السوق - غزة» (@asarsook) posted it for the day: one list's price, not an average or a survey, and the channel states no method. The lists were for the north of the Strip (a heading or section named it). A list is dated by the day it prints, else by the post's day in Gaza. Where a list prints no unit the price is per kilo, as these lists sell produce, meat and fish (the row's basis says which); a printed range is held as its midpoint, both ends beside it (range_printed); a different price the same day sits beside the figure (other_prices_same_day). Not the Chamber's weekly average or WFP's monthly price: never one series."
      serve_warning_ar: "هاد سعر السلعة زي ما نشرته قناة تلغرام «أسعار السوق - غزة» (@asarsook) لهداك اليوم: سعر قائمة وحدة، مش معدّل ولا مسح، والقناة ما بتحكي كيف بتجمع الأسعار. القوائم كانت لشمال القطاع (العنوان أو القسم ذكره). القائمة مأرّخة باليوم اللي مكتوب فيها، وإذا ما في تاريخ فبيوم المنشور بغزة. ولما القائمة ما تكتب وحدة، السعر للكيلو، لأنه هيك بتنباع الخضرة واللحمة والسمك بهالقوائم (والسطر بيقول من وين أخدنا الوحدة)؛ والسعر اللي مكتوب كمدى (من لـ) محطوط نصّه، والطرفين جنبه؛ وإذا في سعر ثاني بنفس اليوم بيكون جنب الرقم. وهاد مش معدّل الغرفة التجارية الأسبوعي ولا سعر برنامج الأغذية الشهري، وما بنحطهم بسلسلة وحدة."
