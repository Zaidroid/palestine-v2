# Gaza's market prices by day, as the Telegram channel «أسعار السوق - غزة» (@asarsook) posts them
# (2026-10-14). The public channel reader holds the posts (data/raw/tg_public/asarsook/,
# ops/fetch_telegram_public.py); ops/build_market_channel.py reads the price lists into
# data/raw/market_channel/prices.json:
#   - 69 goods, each price in the unit its line prints, else by the kilo for produce, meat and
#     fish (these lists sell by the kilo, several say so); a range as its midpoint, its ends kept;
#   - by area where a heading or section names one (the north, Gaza City, the middle area, the south),
#     else the Strip; the price paid by app as series of their own; the days a good was missing;
#   - not read: exchange rates, adverts, commentary, the uqiya and the ratl, packs of no stated size.
# 1848 prices from 209 lists, 2024-11-19 to 2026-09-01, on 2026-10-14, 280 series.
# One price per good, area and day: the earliest list's; a different one the same day sits beside it.
# Beside the Chamber's weekly averages (price_gazacham) and WFP's monthly prices: never merged.
category: price_asarsook
transform: engine
v1_category: food
shape: observation
status: reviewed
records_measured: 1848
input:
  root: data/raw/market_channel
  glob: prices.json
cadence: irregular               # lists most days since November 2024, some weeks none
source_routing:
  by_name:
    "أسعار السوق - غزة (Telegram channel @asarsook)": tg_asarsook
datasets:
  - key: market_channel_prices
    source: tg_asarsook          # migration 120: no licence stated, held for the house
indicator:
  template: "price_asarsook.{measure}"
value:
  num_from: value
  text_from: text                # "missing" on the *_missing rows, nothing else
  unit_from: unit                # ILS/KG · ILS/3 KG · ILS/4 KG · ILS/25 KG · ILS/800 G · ILS/L · ILS/PIECE · ILS/30 PIECES …
occurred_at:
  from: date
  precision: day
place:
  strategy: region               # every record: region = 'Gaza Strip'; the area is in the indicator and attrs
  min_decided_pct: 1.0
attrs_passthrough: [good, area, market_printed, name_printed, line_printed, basis, paid_by_app, range_printed,
                    other_prices_same_day, post, posted_at]
stable_id: stable_id             # asarsook:<day>:<measure>
identity:
  fields: [indicator, occurred_at]
expect:
  min_records: 1500
  max_observations: 6000         # 1848 on 2026-10-14
registry:
  max_unclassified: 0
  rules:
    - when: {equals: "price_asarsook.apple"}
      name_en: "Price of apple in the Gaza Strip (the list names no area) on the day, ILS per kg, as a Gaza market channel posts it (أسعار السوق - غزة)"
      name_ar: "سعر تفاح في قطاع غزة (القائمة لا تذكر منطقة) في اليوم، بالشيكل للكيلوغرام، كما تنشره قناة «أسعار السوق - غزة»"
      concept: food.price
      measure_kind: stock
      polarity: -1
      grain: day
      place_grain: region
      canonical_unit: ILS_per_kg
      serve_warning: "The price of this good as the Telegram channel «أسعار السوق - غزة» (@asarsook) posted it for the day: one list's price, not an average or a survey, and the channel states no method. The list named no area: it may be any of the Strip's markets. A list is dated by the day it prints, else by the post's day in Gaza. Where a list prints no unit the price is per kilo, as these lists sell produce, meat and fish (the row's basis says which); a printed range is held as its midpoint, both ends beside it (range_printed); a different price the same day sits beside the figure (other_prices_same_day). Not the Chamber's weekly average or WFP's monthly price: never one series."
      serve_warning_ar: "هاد سعر السلعة زي ما نشرته قناة تلغرام «أسعار السوق - غزة» (@asarsook) لهداك اليوم: سعر قائمة وحدة، مش معدّل ولا مسح، والقناة ما بتحكي كيف بتجمع الأسعار. القائمة ما ذكرت منطقة: ممكن تكون أي سوق بالقطاع. القائمة مأرّخة باليوم اللي مكتوب فيها، وإذا ما في تاريخ فبيوم المنشور بغزة. ولما القائمة ما تكتب وحدة، السعر للكيلو، لأنه هيك بتنباع الخضرة واللحمة والسمك بهالقوائم (والسطر بيقول من وين أخدنا الوحدة)؛ والسعر اللي مكتوب كمدى (من لـ) محطوط نصّه، والطرفين جنبه؛ وإذا في سعر ثاني بنفس اليوم بيكون جنب الرقم. وهاد مش معدّل الغرفة التجارية الأسبوعي ولا سعر برنامج الأغذية الشهري، وما بنحطهم بسلسلة وحدة."
