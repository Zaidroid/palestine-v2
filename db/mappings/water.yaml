# sources and found to be NO LOSS. ~23k are WHO GHO bundles v1_health_who
# already serves WITH identity (184 codes; JMP WASH access series at exact
# GHO row parity, 75=75); ~2k are World Bank WDI subsets (economic's
# domain); 6 are MPI/SDG strays. GHO's whole WSH_* universe was diffed:
# ONE code with PSE data was missing (WSH_SANITATION_OD) → water_gho.yaml,
# fetched by v2 itself. The water CATEGORY now serves as a domain (051 +
