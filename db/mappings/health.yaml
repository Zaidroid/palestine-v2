# health — WHO Global Health Observatory indicators for Palestine, read from
# GHO's own OData API with every dimension kept (2026-10-12).
#
# WHAT THIS REPLACES. Until 2026-10-12 this spec read a frozen copy of v1's
# file (data/frozen/health.json.gz: WHO's HDX export through v1's unified
# tree, last refreshed 2026-08-05). Three defects were measured on its 12,502
# held rows, and all three came from that route, not from WHO:
#   1. A DIMENSION WAS LOST. WHO publishes many indicators by two or three
#      dimensions at once (sex and age group; sex and cause; patient type,
#      care sector and wealth quintile). The export kept the first. 4,521 held
#      rows in 1,050 groups of (indicator, year) sat side by side with nothing
#      saying which was which (e.g. health.air_41.sex_btsx, 2021: six rows,
#      one per cause of death, the cause gone).
#   2. THE UNIT WAS GUESSED PER ROW. v1 wrote 'percentage' on any value
#      between 0 and 100 that was not whole and 'number' on the rest, so 54
#      indicators (24 codes) held both units: 50.2 deaths from lung cancer
#      became a percentage beside 1,145.7 deaths in total.
#   3. NO VINTAGE AND NO REFRESH. Rows carried no date of publication, and WHO
#      has revised about 2,250 of them since the copy was taken.
# ops/fetch_gho_health.py now fetches the same 184 indicator codes from
# ghoapi.azureedge.net (no code is added), and python:t_health reads GHO's rows
# as WHO publishes them.
category: health
transform: python:t_health
shape: observation
status: reviewed
records_measured: 13975          # 2026-10-12: PSE rows of the 184 codes
                                 #   (183 with rows; NUTWASTINGNUM has none now)
cut_from_v1: 2026-10-12          # v1's shape is replayed by t_health_v1
                                 #   (REPLAY_TRANSFORMERS), the transformer
                                 #   that produced the rows the first run closes

# NO FALLBACK, ON PURPOSE. A run that reads a fallback is additive only: it
# closes nothing. Until the first real run has closed the 12,502 held rows, a
# fallback in the new shape would write the new rows BESIDE them and double
# the dataset. With no file, the run fails on expect.min_records and the held
# rows stand. (After the first run a frozen copy of the fetched file can be
# added as the fresh-clone fallback; it is then harmless.)
input:
  root: data/raw/gho
  glob: health_pse.json
cadence: weekly                  # the fetcher re-fetches a copy older than 6 days

datasets:
  - key: v1_health_who
    source: who                  # every row this spec writes
  # Declared on 2026-08-07 for 210 records of v1's file that carried no
  # indicator code, never loaded, and EMPTY. GHO's API gives neither, so
  # nothing routes to them now. Kept declared so nothing about them changes:
  #   gaza_moh  184 rows: journalists and medical staff killed per day in
  #             Gaza, 2023-10-09 to 2026-04-08, taken by v1 from Tech for
  #             Palestine's casualties_daily. The same two counts are served,
  #             to today, as conflict.gaza_cumulative_killed_press and
  #             conflict.gaza_cumulative_killed_medical (dataset t4p_gaza_daily).
  #   hdx       26 rows: titles of WHO road-safety and beverage-tax answers
  #             ("Existence of a national seat-belt law") with value 0 on all
  #             26. The answers were words; v1 kept none of them.
  - key: v1_health_gaza_moh
    source: gaza_moh
  - key: v1_health_hdx
    source: hdx

indicator:
  template: "health.{IndicatorCode}.{Dim1}.{Dim2}.{Dim3}"
  # Every dimension WHO gives is in the name, in WHO's own slot order, slugged;
  # an empty slot drops its segment. So an indicator with one dimension keeps
  # the name it has always had (health.wsh_water_basic.residenceareatype_totl),
  # one with none is health.<code>, and one with several finally separates:
  #   health.air_41.sex_btsx.ghecause_ghe000680     deaths, lung cancers
  #   health.nutrition_wh_2.sex_fmle.agegroup_months24_35
  # 1,573 names over the 13,975 rows; (indicator, year) is unique on all of
  # them (measured 2026-10-12), which is what makes each a series a chart can
  # draw. The dimensions are also in attrs, exactly as WHO codes them:
  #   dim        {SEX: SEX_BTSX, GHECAUSE: GHECAUSE_GHE000680}
  #   dim_label  {SEX: "Both sexes", GHECAUSE: "Trachea, bronchus, lung cancers"}
  #   dim_key    "SEX=SEX_BTSX;GHECAUSE=GHECAUSE_GHE000680"   ('' for none)

value:
  num_from: NumericValue         # WHO's number. A row without one is dropped
                                 #   and counted (see drop), never parsed out
                                 #   of the display string.
  text_from: null
  unit_from: indicator_name      # THE UNIT IS DECIDED PER INDICATOR, from what
                                 #   WHO's name for it states (gho_unit_from_name:
                                 #   "per 100 000", "(%)", "(years)", "per capita
                                 #   in US$", "(thousands)", "Number of ... deaths",
                                 #   ...), never from a row's value. 138 of the
                                 #   184 names state one.
  # The 46 names the rule cannot decide: 28 get the unit WHO's own indicator
  # page states (www.who.int/data/gho/data/indicators/indicator-details/GHO/<name>,
  # the Indicator Metadata Registry fields, read 2026-10-12; the words quoted
  # are WHO's), and 18 get none. null = decided: no unit can be stated, and
  # the row carries none.
  unit_by_code:
    AIR_41: persons                # definition: "the absolute number of deaths (or DALYs) attributed to air pollution"
    AIR_7: dalys                   # the same definition; this code is the DALYs
    NCD_DTH_TOT: persons           # Unit of Measure: "Deaths"
    NCD_UNDER70: percent           # "as a percentage of NCD deaths among all ages"
    CHILDVIOL: percent             # Data type: "Proportion"; the name: "Proportion of children aged 1-17 years ..."
    NCD_DIABETES_PREVALENCE_AGESTD: percent   # page "Diabetes, prevalence (%)": "Percentage of people aged 18 years and over with ..."
    NCD_DIABETES_PREVALENCE_CRUDE: percent    # the same measure without age-standardisation; its own page was not found, decided from its twin's
    NCD_DIABETES_TREATMENT_AGESTD: percent    # "Percentage of people aged ≥ 30 years with diabetes who are currently using ..."
    NUT_BF_CBF: percent            # "Percentage of children 12–23 months of age who were fed breast milk ..."
    NUT_BF_EBF: percent            # indicator name on the page: "Exclusive breastfeeding under 6 months (%)"
    NUT_BF_EBF2D: percent          # "Percentage of children born in the last 24 months who were fed exclusively ..."
    NUT_BF_EIBF: percent           # "Percentage of children born in the last 24 months who were put to the breast ..."
    NUT_BF_EVBF: percent           # "Percentage of children born in the last 24 months who were ever breastfed"
    NUT_CF_EFF: percent            # "Percentage of children 6–23 months of age who consumed egg and/or flesh food ..."
    NUT_CF_ISSSF: percent          # indicator name on the page: "introduction of solid, semi-solid or soft foods (%)"
    NUT_CF_MAD: percent            # "Percentage of children 6–23 months of age who consumed a minimum acceptable diet ..."
    NUT_CF_MDD: percent            # "Percentage of children 6–23 months of age who consumed foods and beverages from ..."
    NUT_CF_MMF: percent            # "Percentage of children 6–23 months of age who consumed solid, semi-solid or soft foods ..."
    TB_1: percent                  # Unit of Measure: "Percent"
    TB_c_new_tsr: percent          # "The proportion of cases registered in a given year ... that successfully completed treatment"
    TB_c_ret_tsr: percent          # Unit of Measure: "Percent"
    TB_c_tbhiv_tsr: percent        # as TB_c_new_tsr
    TB_c_newinc: cases             # Unit of Measure: "Cases"
    TB_c_mdr_tx: cases             # Unit of Measure: "Cases"
    TB_rr_mdr: cases               # Unit of Measure: "Cases"
    SDGPM25: ug_per_m3             # Unit of Measure: "Micrograms per cubic meter [micrograms/m3]"
    # WHO's API name for these two says "(millions)". WHO's own page for the
    # same code is titled "Stunting among children under 5 years of age (number
    # in thousands) (model-based estimates)", and Palestine's values (25.3 to
    # 69.0, against a stunting prevalence of 7.1 to 12.0 %) can only be
    # thousands. The page is followed, and this comment is the record that the
    # two labels disagree.
    NUTSTUNTINGNUM: thousand_persons
    NUTWASTINGNUM: thousand_persons   # page: "Wasting ... (number in thousands)"; no PSE rows on 2026-10-12
    # NO UNIT. One code holds several kinds of answer under its TOBACCO_INDICATOR
    # dimension (a price in a currency, a tax share, a score from 1 to 5, a
    # year, a budget), or WHO's page states nothing that fits.
    TAXBEV_PRICE: null             # "Beverage price": no currency or volume stated anywhere
    TOBACCO_MPOWER_M3_TOBACCOUSESMOKINGSCHOOL: null
    TOBACCO_MPOWER_M4_SMOKELESSECIGARETTESSCHOOL: null
    TOBACCO_MPOWER_NTCP: null
    TOBACCO_MPOWER_OVERVIEW: null
    TOBACCO_MPOWER_P2_SMOKEFREEPLACEDETAILS: null
    TOBACCO_MPOWER_R_AFFORDABILITY: null
    TOBACCO_MPOWER_R_INFLATIONADJUSTEDPRICES: null
    TOBACCO_MPOWER_R_PRICE: null   # Unit of Measure: "Currency" (which one is another row's answer)
    TOBACCO_MPOWER_R_TAX: null
    TOBACCO_MPOWER_R_TAXREVENUELATEST: null
    TOBACCO_MPOWER_R_TAXREVENUEPREVIOUS: null
    TOBACCO_MPOWER_W1A_CIGARETTES: null
    TOBACCO_MPOWER_W1B_TOBACCOSMOKED: null
    TOBACCO_MPOWER_W1C_TOBACCOSMOKELESS: null
    TOBACCO_MPOWER_W2A_CIGARETTES: null
    TOBACCO_MPOWER_W2B_TOBACCOSMOKED: null
    TOBACCO_MPOWER_W2C_TOBACCOSMOKELESS: null

occurred_at:
  from: TimeDim                  # WHO's own year key → YYYY-01-01, precision
  precision: year                #   year (law 2). A survey period ("2017-2019")
  rules: []                      #   is filed under the year WHO files it under
                                 #   (2019) with attrs.period = "2017-2019".
                                 # reported_at = the row's `Date`: WHO's last
                                 #   update of that row, its vintage. It is not
                                 #   part of what a row says, so WHO republishing
                                 #   an unchanged number rewrites nothing.

place:
  strategy: none                 # SpatialDim PSE on every row: the whole
                                 #   territory → place_id NULL, attrs.region
                                 #   'Palestine' (law 3)

stable_id: stable_id             # gho:<code>:<year>:<dim_key>, WHO's own key

drop:
  - reason: no_numeric_value     # WHO gave no number: 908 answers in words or
    measured: 943                #   placeholders ("Yes", "No", "ILS", "—",
                                 #   ". . .") on 20 tobacco codes, 35 blank
                                 #   rows on 11 other codes. v1 held none of
                                 #   them either. They stay in the raw file.
  - reason: projection_after_publication
    measured: 18                 # the 2030 point of six tobacco trend
                                 #   estimates (M_Est_*), three sexes each:
                                 #   dated after WHO's own `Date` for the row
  - reason: missing_identity
    measured: 0                  # defensive: no code or no year

expect:
  min_records: 12500             # 13,975 at spec time; the fetcher refuses
                                 #   below this too
  max_observations: 15000        # 13,014 emitted, ~1.15×

identity:
  # A row is one indicator, one year, one combination of dimensions. The value
  # and its bounds are NOT in the identity (they were until 2026-10-12, because
  # the value was the only thing left that told two rows apart): WHO revising a
  # number now supersedes the row that held the old one.
  fields: [indicator, occurred_at, place_id]
  attrs: [dim_key]
  # The fetch is WHO's whole current publication for these codes, so a held
  # row the run no longer emits was withdrawn or re-coded upstream and is
  # closed (never deleted).
  generation: complete
  # THE FIRST RUN IS MADE BY HAND, with `--allow-absent 12502`. The 12,502 held
  # rows carry the old identity (indicator, year, value, bounds); none of them
  # can be emitted again, and 4,521 of them could not be given the new identity
  # by any rewrite, because the dimension that would complete it is not in the
  # row. So that run closes all 12,502 as absent and writes the 13,014 rows
  # that name their dimensions, in one transaction. No ceiling is written here:
  # the default (5 % of the rows held) applies to every night after it, and a
  # night that would close more fails instead.

notes: |
  MEASURED 2026-10-12 on the first fetch (ops/fetch_gho_health.py, 184 codes):
  13,975 rows for PSE, 1975 to 2030; 13,032 with a number; 18 of those are
  projections; 13,014 observations. Dimension slots in use: 12,804 rows have a
  first, 7,446 a second, 657 a third. (code, year, Dim1, Dim2, Dim3) is unique
  on all 13,975.

  THE HELD ROWS AGAINST THE FETCH (matched on code, year, first dimension and
  value, the only fields both sides have): of 12,502 held, 10,243 are published
  with the same value (now with every dimension named), 2,250 with a revised
  value (1,247 where the group holds one row, 1,003 inside a group of several,
  where no rule can say which new row replaces which old one), and 9 are no
  longer published at all (NUTWASTINGNUM 8, SDGHEPHBSAGPRV 1).

  LICENCE. The source row `who` records CC-BY-NC-SA-3.0-IGO, non-commercial.
  That is what WHO states on its HDX page for this data; www.who.int's own
  terms for datasets are different in wording and no more permissive (public
  health purposes, attribution, no use "in conjunction with the promotion of a
  commercial enterprise"). The licence is read from the source row, never from
  a record.

  WHAT IS NOT LOADED. The 908 answers WHO gives in words for tobacco-control
  policy (is there a health warning on the pack: Yes / No). They are WHO's
  data for held codes, and the series reader serves numbers only; loading them
  as value_text needs a decision about how a yes/no series is served.

registry:
  max_unclassified: 0
  rules:
    # ── water and sanitation (JMP), all percentages ──────────────────────────
    - when: {regex: "^health\\.wsh_sanitation", unit: [percent, percentage]}
      concept: sanitation.access
      measure_kind: ratio
      grain: year
      place_grain: region
      canonical_unit: percent
    - when: {regex: "^health\\.wsh_sanitation"}
      concept: sanitation.access
      measure_kind: unclassified
      grain: year
      place_grain: region
      note: a WASH sanitation series whose unit is not stated; the kind of number is then unknown
    - when: {regex: "^health\\.wsh", unit: [percent, percentage]}
      concept: water.access
      measure_kind: ratio
      grain: year
      place_grain: region
      canonical_unit: percent
    - when: {regex: "^health\\.wsh"}
      concept: water.access
      measure_kind: unclassified
      grain: year
      place_grain: region
      note: a WASH water series whose unit is not stated; the kind of number is then unknown

    # ── nutrition ────────────────────────────────────────────────────────────
    - when: {regex: "^health\\.(nut|nutrition)", unit: [percent, percentage]}
      concept: health.outcome
      measure_kind: ratio
      grain: year
      place_grain: region
      canonical_unit: percent
    - when: {regex: "^health\\.(nut|nutrition)", unit: [thousand_persons]}
      concept: health.outcome
      measure_kind: stock
      grain: year
      place_grain: region
      canonical_unit: persons
      note: children or women affected at the time, stated by WHO in thousands
    - when: {regex: "^health\\.(nut|nutrition)", unit: [number]}
      concept: health.outcome
      measure_kind: stock
      grain: year
      place_grain: region
      note: LEGACY, v1's unit on the rows held until the first GHO run closes them
    - when: {regex: "^health\\.(nut|nutrition)"}
      concept: health.outcome
      measure_kind: unclassified
      grain: year
      place_grain: region
      note: a nutrition series whose unit is not stated; the kind of number is then unknown

    # ── health financing ─────────────────────────────────────────────────────
    - when: {regex: "^health\\.(ghed|finprotection|financialhardship)", unit: [percent, percentage]}
      concept: health.service
      measure_kind: ratio
      grain: year
      place_grain: region
      canonical_unit: percent
    - when: {regex: "^health\\.(ghed|finprotection|financialhardship)", unit: [USD_per_capita]}
      concept: health.service
      measure_kind: rate
      grain: year
      place_grain: region
      canonical_unit: USD_per_capita
    - when: {regex: "^health\\.(ghed|finprotection|financialhardship)", unit: [number]}
      concept: health.service
      measure_kind: stock
      grain: year
      place_grain: region
      note: LEGACY, v1's unit on the rows held until the first GHO run closes them
    - when: {regex: "^health\\.(ghed|finprotection|financialhardship)"}
      concept: health.service
      measure_kind: unclassified
      grain: year
      place_grain: region
      note: a health-financing series whose unit is not stated; the kind of number is then unknown

    # ── everything else: the unit says the kind of number ────────────────────
    - when: {regex: "^health\\.", unit: [percent, percentage, per_100]}
      concept: health.outcome
      measure_kind: ratio
      grain: year
      place_grain: region
      canonical_unit: percent
    - when: {regex: "^health\\.", unit: [per_1000]}
      concept: health.outcome
      measure_kind: rate
      grain: year
      place_grain: region
      canonical_unit: per_1000
    - when: {regex: "^health\\.", unit: [per_10000]}
      concept: health.outcome
      measure_kind: rate
      grain: year
      place_grain: region
      canonical_unit: per_10000
    - when: {regex: "^health\\.", unit: [per_100000]}
      concept: health.outcome
      measure_kind: rate
      grain: year
      place_grain: region
      canonical_unit: per_100000
    - when: {regex: "^health\\.", unit: [ug_per_m3]}
      concept: health.outcome
      measure_kind: rate
      grain: year
      place_grain: region
      canonical_unit: ug_per_m3
      note: a concentration (annual mean PM2.5), an amount per volume
    - when: {regex: "^health\\.", unit: [g_per_100ml]}
      concept: health.outcome
      measure_kind: rate
      grain: year
      place_grain: region
      canonical_unit: g_per_100ml
    - when: {regex: "^health\\.", unit: [index]}
      concept: health.outcome
      measure_kind: index
      grain: year
      place_grain: region
      canonical_unit: index
    - when: {regex: "^health\\.", unit: [years]}
      concept: health.outcome
      measure_kind: stock
      grain: year
      place_grain: region
      canonical_unit: years
      note: life expectancy, a level; `stock` as this spec has always classed it
    # Counts. What is counted over a year is a flow: deaths, cases reported or
    # estimated, births, the burden in DALYs, money disbursed. Each is named,
    # so a count this list does not know lands unclassified and is seen.
    - when: {regex: "^health\\.(air_41|childdeath5to14|cm_0[1-4]|deathado|mort_maternalnum|ncd_dth_tot)(\\.|$)", unit: [persons]}
      concept: health.outcome
      measure_kind: flow
      grain: year
      place_grain: region
      canonical_unit: persons
      note: deaths during the year
    - when: {regex: "^health\\.(whs3_|tb_)", unit: [cases]}
      concept: health.outcome
      measure_kind: flow
      grain: year
      place_grain: region
      canonical_unit: count
      note: cases reported, estimated or started on treatment during the year
    - when: {regex: "^health\\.pretermbirth_number(\\.|$)", unit: [count]}
      concept: health.outcome
      measure_kind: flow
      grain: year
      place_grain: region
      canonical_unit: count
      note: preterm births during the year
    - when: {regex: "^health\\.lbw_number(\\.|$)", unit: [thousand_persons]}
      concept: health.outcome
      measure_kind: flow
      grain: year
      place_grain: region
      canonical_unit: persons
      note: newborns of low birth weight during the year, stated by WHO in thousands
    - when: {regex: "^health\\.air_7(\\.|$)", unit: [dalys]}
      concept: health.outcome
      measure_kind: flow
      grain: year
      place_grain: region
      canonical_unit: dalys
    - when: {regex: "^health\\.sdgodaws(\\.|$)", unit: [USD_millions]}
      concept: health.outcome
      measure_kind: flow
      grain: year
      place_grain: region
      canonical_unit: USD
      note: aid disbursed during the year, constant 2024 US$
    - when: {regex: "^health\\.", unit: [number]}
      concept: health.outcome
      measure_kind: stock
      grain: year
      place_grain: region
      note: LEGACY, v1's unit on the rows held until the first GHO run closes them
    - when: {regex: "^health\\."}
      concept: health.outcome
      measure_kind: unclassified
      grain: year
      place_grain: region
      note: >-
        The unit is not stated (health.yaml value.unit_by_code lists the codes
        and why), so the KIND of number is not known. /correlate refuses an
        unclassified kind by design: a series nobody has established the kind
        of is one nobody should plot against another.
