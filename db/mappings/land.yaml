# land — checkpoints, demolitions and settlements; three sources, three licenses
# Audit: 697 records, 100% dated, 66% ingest masquerade, 0% year-bucket, 0%
# latlon / 0% pcode. The 66% is not a category-wide defect: it splits exactly
# along source lines. Good Shepherd Collective's 237 demolitions carry a real
# event date; OCHA's 261 checkpoints and Peace Now's 199 settlements are
# registers with no date at all. Routing is three-way and exhaustive (law 5).
#
# v2 READS THE PUBLISHERS ITSELF since 2026-10-12 (branch supply-scrapes): see
# `input:` below. Reading the publishers' own records that day corrected three
# things this header says, and the corrections are in `notes:` (PROVENANCE,
# MEASURED 2026-10-12): the 261 "checkpoints" are the 261 segments of OCHA's
# West Bank Separation Barrier file of January 2018; the 199 settlements are
# OCHA oPt's HDX file of Peace Now's built-up areas, end of 2018; and Good
# Shepherd's daily counts are UN OCHA's demolition record, republished, for
# the West Bank and East Jerusalem.
category: land
transform: python:t_land
shape: observation
status: reviewed
records_measured: 697

source_routing:
  by_name:
    "OCHA oPt": ocha                              # 261 records
    "Good Shepherd Collective": goodshepherd      # 237 records
    "Peace Now": peace_now                        # 199 records — pin REQUIRED,
                                                  #   the alias is ambiguous
  default: null            # measured: 0/697 records have an empty sources[];
                           #   sources[] has exactly one entry on 697/697

datasets:
  # Three registers, three shapes, three identities — MEASURED injective
  # against live rows 2026-08-07. The single spec-level key below described
  # only OCHA's; it froze the other two (goodshepherd 237 rows → 1 key,
  # peace_now 199 → 175) and both silently stopped accepting data.
  - key: v1_land_ocha
    source: ocha                    # 261 named checkpoints = 261 / 261 ✓
  - key: v1_land_goodshepherd
    source: goodshepherd
    overrides:
      identity:
        # A daily confiscation-watch feed: land_name/type/status are the SAME
        # string on all 237 rows (measured cardinality 1). The date is the
        # only thing that distinguishes one report from the next.
        fields: [indicator, occurred_at]             # = 237 / 237 ✓
  - key: v1_land_peace_now
    source: peace_now
    overrides:
      identity:
        # A settlement register on one ingest date: the name alone collides
        # on 24 rows (175 distinct of 199), because Peace Now lists several
        # parcels per settlement. Area separates them.
        fields: [indicator]
        attrs: [land_name, area_dunums]              # = 199 / 199 ✓

indicator:
  template: "land.{event_type}"    # land.checkpoint 261 / land.demolition 237
                                   #   / land.settlement 199. land_type equals
                                   #   event_type on 697/697 — either works.

value:
  num_from: metrics.count          # 1 on checkpoints+settlements; the count of
                                   #   structures demolished on demolitions
                                   #   (== metrics.demolished on 237/237,
                                   #   observed 1..16)
  text_from: land_status
  unit_from: metrics.unit          # 'sites' 460 / 'structures' 237 — honest here

occurred_at:
  from: date
  precision: day
  rules:                           # ordered, first match wins
    - if: "event_type == 'demolition'"
      then: "occurred_at = demolition.demolition_date, precision=day"
      # HONEST DATE. Filled on 237/237 demolitions (34.0% of the category) and
      # equal to `date` on 237/237, range 2025-06-30..2026-07-30. Written as an
      # explicit rule rather than relying on `date` so the provenance is on the
      # record: this occurred_at comes from a reported demolition date, not
      # from an ingest timestamp that happens not to collide.
    - if: "date == fetch_day"
      then: "reported_at-only"
      # Fires on 460/697 = 0.660, matching the audit exactly: all 261 OCHA
      # checkpoints and all 199 Peace Now settlements. Neither carries any
      # other date field. 0/237 demolitions reach this rule.

place:
  strategy: region                 # location.region: West Bank 460 /
                                   #   Palestine 237
  min_decided_pct: 1.0            # West Bank → place 2; 'Palestine' →
                                   #   place_id NULL + attrs.region (law 3)

stable_id: stable_id               # 697 distinct. DO NOT use `id`: only 673
                                   #   distinct, 24 rows collide (see notes)
attrs_passthrough:
  - land_type
  - land_name
  - land_status
  - checkpoint.checkpoint_type
  - checkpoint.operational_status
  - checkpoint.permits_required
  - demolition.structure_type
  - demolition.structures_demolished
  - demolition.reason
  - demolition.notification_given
  - demolition.owner_type
  - settlement.settlement_type
  - settlement.area_dunums
  - settlement.legal_status

expect:
  min_records: 627                 # 0.9 × 697
  max_observations: 810            # 1.15 × 697 measured

# Format v2 `input:` — v2's own fetch (2026-10-12). Three raw files, written
# by two fetchers in the record shape t_land already reads:
#   barrier.json      ops/fetch_hdx_land.py   HDX west-bank-barrier (OCHA oPt)
#   settlements.json  ops/fetch_hdx_land.py   HDX state-of-palestine-settlements
#   demolitions.json  ops/fetch_goodshepherd.py   the collective's own JSON
# The frozen corpus is v1's unified file of 2026-10-12 and is read only by a
# machine that has never fetched (additive only). If one of the three files is
# missing the run reads fewer than expect.min_records and is refused, loudly,
# rather than loading two thirds of a category.
input:
  root: data/raw/land
  glob: [barrier.json, settlements.json, demolitions.json]
  fallback:
    root: data/frozen
    glob: land.json.gz
cadence: daily                     # demolitions move daily; the two registers
                                   #   are 2018 files the fetcher re-reads only
                                   #   when HDX says they changed

notes: |
  PROVENANCE, MEASURED 2026-10-12 (the publishers' records, v1's scripts and
  v1's own intermediate files; nothing below changes what a row holds):

    v1_land_ocha — NOT checkpoints. v1's fetch-land-data.js searches HDX for
      "west bank closure" inside OCHA oPt and takes the first result with a
      shapefile; that result is "West Bank Separation Barrier" (HDX
      `west-bank-barrier`, Barrier_Jan2018, dataset_date 2018-01-01, file
      last modified 2019-07-16, licence `cc-by`). The 261 rows are its 261
      line segments: 181 Constructed, 28 Under Construction, 52 Projected
      (712 km in all, 464 km constructed). `land_name` is `<Type> -
      <OBJECTID>`; `checkpoint_type` is "Barrier" on all; `permits_required:
      true` is a default in v1's code, not in the file. The indicator name
      `land.checkpoint`, the concept `movement.checkpoint` and the unit
      `sites` are therefore all wrong for these rows, and the same 261
      segments are held again as `infrastructure.barrier_segment`
      (v1_infrastructure_hdx). Renaming or retiring them is a migration and
      Zaid's decision; the fetcher keeps the held shape so nothing is
      rewritten meanwhile, and keeps status, type and length in metres in the
      raw record (`upstream`).
    v1_land_peace_now — HDX `state-of-palestine-settlements`, published by
      OCHA oPt ("Settlements data provided by Peace Now"), dataset_date
      2018-12-30/31, file last modified 2021-06-03, licence `cc-by-igo` as HDX
      states it. 201 built-up-area polygons with a name and an area only:
      `Authorized` (land_status, legal_status) and `Settlement`
      (settlement_type) are v1 defaults, on every row. Two unnamed polygons
      share name and rounded area with another and collapse (199 rows).
    v1_land_goodshepherd — goodshepherdcollective.org/api/home_demolitions.json,
      a rolling window of about thirteen months, one entry per day with an
      incident. The collective's page: "This data only represents information
      from UN OCHA, which focuses on the West Bank and East Jerusalem". So the
      region is the West Bank including East Jerusalem, not "Palestine" (v1's
      default, kept: place stays NULL until Zaid's decision), and the five
      demolition.* attributes are v1 defaults (residential / 1 / Administrative
      demolition / notification given / Private). v1 also stored a day of 0
      structures as 1 (`0 || 1`); the fetcher writes the publisher's 0.

  THE THREE DATASETS ARE DISJOINT AND SOURCE == EVENT_TYPE, 1:1, measured:
    OCHA oPt              × checkpoint   261   CC-BY-IGO-3.0    all date==fetch_day
    Good Shepherd Collective × demolition 237  CC-BY-NC-SA-4.0  0 date==fetch_day
    Peace Now             × settlement   199   CC-BY-NC-4.0     all date==fetch_day
  261+237+199 = 697 with no cross-tabulation, so the date rules above can be
  keyed on event_type and still be exactly source-scoped. The masquerade
  fraction 460/697 = 0.660 reproduces the audit's 0.66 to the digit.

  HONEST DATE, WHERE IT EXISTS. demolition.demolition_date is the only real
  event date in the category: present on 237/697 (34.0%), day-precise, spanning
  2025-06-30..2026-07-30, and identical to `date` on all 237. So one third of
  land keeps day precision and two thirds go precision=unknown. Checkpoints and
  settlements were searched field by field for any other date or year: the only
  4-digit-year matches outside `date` and `sources[].fetched_at` are
  demolition.demolition_date (237) and a single settlement.area_dunums value of
  2004 (a dunum area that coincidentally looks like a year — not a date).

  LICENSE — 042 WINS OVER THE RECORD, AND THAT IS DELIBERATE. The records
  carry license strings that are more permissive than the registry:
    goodshepherd — record says CC-BY-NC-SA-4.0; 042 and licenses.json say
      'verify-required', commercial_use false/unknown, verify_required true.
    peace_now    — record says CC-BY-NC-4.0; 042 and licenses.json say
      'verify-required', commercial_use false, verify_required true.
    ocha         — record says CC-BY-IGO-3.0; 042 agrees, commercial_use true.
  042's quarantine-by-default rule means the source row governs, so 436 of 697
  rows (goodshepherd + peace_now) are non-commercial and free-tier-only until
  Zaid verifies. Only the 261 OCHA checkpoint rows are commercially servable.
  Do not "upgrade" a source row from the record's own license claim — the
  record's claim is v1's assertion, not the upstream's grant.

  ROUTING HAZARD — the 'peace now' alias is AMBIGUOUS in licenses.json. It
  appears in the aliases list of BOTH `peace_now` and `historical_archives`
  (whose alias list is a 50-entry catch-all that also swallows 'middle east
  eye', 'al-haq', 'un', 'passia', 'adalah'). Alias resolution alone would pick
  arbitrarily. The by_name pin above is therefore mandatory, not a convenience.
  'OCHA oPt' → ocha and 'Good Shepherd Collective' → goodshepherd are both
  unambiguous, but are pinned for symmetry and so a future alias edit cannot
  silently re-route them.

  PLACE IS REGION AND THAT IS THE CEILING. 0% latlon, 0% pcode, 0%
  gazetteer_key across all 697. location.governorate is the literal string
  'Unknown' on all 261 checkpoints and null on all 237 demolitions (filled 66%,
  which is exactly the 'Unknown'/'Unknown' pair, i.e. zero information).
  location.name is 'West Bank' on checkpoints and settlements and 'Multiple
  locations' on all 237 demolitions — never a locality. land_name (437 distinct)
  is not a place either, per event_type:
    checkpoint  — 'Concrete - 1', 'Fence - 2', 'Concrete - 3' … type plus a
                  serial number. 261 distinct, zero place content.
    demolition  — 'Multiple locations' on all 237.
    settlement  — real Israeli settlement names (Ariel, Beitar Illit, Bracha;
                  175 distinct, 24 'Unknown'). Law 3 forbids matching these
                  against the Palestinian gazetteer, and they are not in it.
  So region, min_decided_pct 1.0: 460 → place 2 (West Bank), 237 → place_id
  NULL with attrs.region 'Palestine'.

  `id` IS NOT UNIQUE. 697 records carry only 673 distinct `id` values: the
  settlement id 'land-8maah0' is shared by 22 rows and 'land-oiinzd' by 4 (all
  of them the settlements whose land_name is 'Unknown' — v1's id generator
  collided on the name). stable_id is distinct on 697/697. Any future spec that
  is tempted to fall back to `id` when stable_id is missing must not do it here.

  metrics.value is 0 on 697/697 across all three sources and must never be
  read; metrics.count is the honest number. metadata.json is wrong on two
  counts — it claims 699 records (actual 697) and names its sources as
  "OCHA, B'Tselem, Peace Now", but B'Tselem appears in 0 records and the third
  source is Good Shepherd Collective. Trust the records.

# Format v2 `identity:` — cross-run natural-key idempotency (added 2026-08-07
# after v1 re-hashed every stable_id and this dataset silently re-inserted its
# whole generation). This is what a row IS, independent of v1's hashing; the
# loader refuses to write a row whose identity the databank already holds.
# Spec-level default: OCHA's named-checkpoint register. The other two
# datasets override it above — see why there.
identity:
  fields: [indicator]
  attrs: [land_name, checkpoint_type]

registry:
  max_unclassified: 0
  rules:
    - when: {equals: "land.checkpoint"}
      # NOT checkpoints (found 2026-10-12): v1 took the first shapefile an HDX
      # search returned and named its rows land.checkpoint. The key stays so
      # nothing that reads it breaks; the concept, the name and the warning say
      # what the rows are.
      name_en: "West Bank Separation Barrier segments (OCHA, January 2018)"
      name_ar: "مقاطع جدار الفصل في الضفة الغربية (أوتشا، كانون الثاني 2018)"
      concept: movement.closure
      measure_kind: stock
      polarity: -1
      grain: register
      place_grain: region
      canonical_unit: sites
      serve_warning: "These rows are the 261 segments of the West Bank Separation Barrier as OCHA mapped it in January 2018 (constructed, under construction or projected), not checkpoints: the series' key is a misnomer kept for compatibility. It is a 2018 map, not today's. The same segments are also held as infrastructure.barrier_segment, so the two are never added."
      serve_warning_ar: "هاي السطور هي 261 مقطع من جدار الفصل بالضفة زي ما رسمته أوتشا بكانون الثاني 2018 (مبني، قيد البناء، أو مخطّط)، مش حواجز: اسم السلسلة غلط وباقي بس عشان اللي بيقرأها ما ينكسر. وهي خريطة 2018 مش اليوم. ونفس المقاطع محفوظة كمان باسم infrastructure.barrier_segment، فما بينجمعوا مع بعض."
    - when: {equals: "land.settlement"}
      name_en: "Israeli settlement built-up areas in the West Bank (Peace Now via OCHA, end of 2018)"
      name_ar: "المناطق المبنية للمستوطنات الإسرائيلية في الضفة الغربية (السلام الآن عبر أوتشا، نهاية 2018)"
      concept: settlement
      measure_kind: stock
      polarity: -1
      grain: register
      place_grain: region
      canonical_unit: sites
      serve_warning: "One row per settlement built-up area, with its name and its area in dunums, as Peace Now's data stood at the end of 2018 (published by OCHA). The file says nothing about a settlement's legal status or type, and it is not today's list."
      serve_warning_ar: "كل سطر منطقة مبنية لمستوطنة، باسمها ومساحتها بالدونم، حسب بيانات السلام الآن لنهاية 2018 (نشرتها أوتشا). الملف ما بيذكر الوضع القانوني للمستوطنة ولا نوعها، وهو مش قائمة اليوم."
    - when: {equals: "land.demolition"}
      name_en: "Structures demolished per day, West Bank and East Jerusalem (Good Shepherd Collective, from OCHA)"
      name_ar: "المباني المهدومة باليوم في الضفة الغربية والقدس الشرقية (غود شيبرد، عن أوتشا)"
      concept: demolition
      measure_kind: flow
      polarity: -1
      grain: event
      place_grain: region
      canonical_unit: structures
      serve_warning: "The Good Shepherd Collective's republication of UN OCHA's demolition record for the West Bank and East Jerusalem: the same demolitions as OCHA's own series in the demolitions category, so the two are never added. Days before 8 September 2025 were stored by the old system with a minimum of 1 structure and can no longer be checked."
      serve_warning_ar: "هاد إعادة نشر من غود شيبرد لسجلّ أوتشا للهدم بالضفة والقدس الشرقية: نفس الهدم الموجود بسلسلة أوتشا بفئة demolitions، فما بينجمعوا مع بعض. والأيام قبل 8 أيلول 2025 سجّلها النظام القديم بحد أدنى مبنى واحد وما عاد ممكن نتحقق منها."
