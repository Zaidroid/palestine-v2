      name_en: "People analysed in Gaza governorate, in the period beginning on this date (IPC)"
      name_ar: "السكان المشمولون بالتحليل في محافظة غزة، في الفترة التي تبدأ بهذا التاريخ (التصنيف المرحلي IPC)"
