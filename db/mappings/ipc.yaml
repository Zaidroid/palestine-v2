      serve_warning_ar: "هاد تحليل للتصنيف المرحلي المتكامل للأمن الغذائي (IPC) لقطاع غزة (فريق العمل الفني الوطني، عن طريق HDX): عدد الناس المقدّر بكل مرحلة خلال فترة التحليل، مأرّخ بأول يوم بالفترة (وآخر يوم وشهر التحليل مكتوبين بالسطر). كل تحليل بيعطي الفترة الحالية وتوقّع للفترة اللي بعدها. ومناطق التحليل بتتغيّر من تحليل لتحليل، فكل منطقة إلها سلسلة لحالها؛ والمناطق المدموجة (المحافظات الشمالية، أو دير البلح مع خان يونس) مش محافظة وحدة. وبتحليل أيار 2024 الملف سمّى المنطقتين المدموجتين «شمال غزة» و«دير البلح»، بس عدد سكانهم بيبيّن إنهم المناطق المدموجة، وهيك محطوطين. والمرحلة 5 على مستوى المنطقة هي الكارثة؛ أما المجاعة فبتعلنها لجنة مراجعة المجاعة التابعة للتصنيف. هاد التوقّع اللي عمله التحليل للفترة: شو كان متوقّع، مش شو انقاس."
