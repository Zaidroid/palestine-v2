# IPC's acute food insecurity analyses for the Gaza Strip (2026-10-14). ops/fetch_ipc.py reads HDX's dataset
# (contributed by IPC, CC0) nightly, ten seconds between its three requests, into data/raw/ipc/phases.json:
# for each analysis (Dec 2023 to May 2026, 8 analyses), its current period and its projection, by area,
# the people and the share in each phase (1 to 5, and 3 or worse). Areas are series of their own: single
# governorates are placed at their governorate, combined areas and the Strip at the region. 1014 records.
category: ipc
transform: engine
v1_category: food
shape: observation
status: reviewed
records_measured: 1014
input:
  root: data/raw/ipc
  glob: phases.json
cadence: irregular               # an analysis every two to six months
source_routing:
  by_name:
    "Integrated Food Security Phase Classification (IPC), via HDX": ipc_hdx
datasets:
  - key: ipc_phases
    source: ipc_hdx              # migration 122: CC0 on HDX; held at ask until Zaid grades it
indicator:
  template: "ipc.{measure}"
value:
  num_from: value
  text_from: null
  unit_from: unit                # persons · percent
occurred_at:
  from: date                     # the period's first day; its last is attrs.period_end
  precision: month
place:
  strategy: governorate
  name_from: location.governorate
  fallback: [region, none]
  min_decided_pct: 1.0
attrs_passthrough: [period_end, analysis, validity, area, area_printed]
stable_id: stable_id             # ipc:<measure>:<period start>
identity:
  fields: [indicator, occurred_at]
expect:
  min_records: 400
  max_observations: 4000         # 1014 on 2026-10-14; about 130 an analysis
registry:
  max_unclassified: 0
  rules:
    - when: {equals: "ipc.population_analysed_deir_al_balah"}
      name_en: "People analysed in Deir al-Balah, in the period beginning on this date (IPC)"
      name_ar: "السكان المشمولون بالتحليل في دير البلح، في الفترة التي تبدأ بهذا التاريخ (التصنيف المرحلي IPC)"
      concept: food.security
      measure_kind: stock
      grain: period
      place_grain: governorate
      canonical_unit: persons
      serve_warning: "An IPC acute food insecurity analysis for the Gaza Strip (National IPC Technical Working Group, via HDX): the people estimated in each phase over the analysis's period, dated by the period's first day (its last day is in the row, with the analysis's month). Each analysis states the current period and a projection for the next. IPC's areas change between analyses, so each area is a series of its own; combined areas (the northern governorates, Deir al-Balah with Khan Younis) are never one governorate. In the May 2024 analysis the file names its combined areas \"North Gaza\" and \"Deir Al-Balah\"; their populations show they are the combined areas, and they are held as such. Phase 5 at area level is catastrophe; famine is declared for an area by IPC's Famine Review Committee."
      serve_warning_ar: "هاد تحليل للتصنيف المرحلي المتكامل للأمن الغذائي (IPC) لقطاع غزة (فريق العمل الفني الوطني، عن طريق HDX): عدد الناس المقدّر بكل مرحلة خلال فترة التحليل، مأرّخ بأول يوم بالفترة (وآخر يوم وشهر التحليل مكتوبين بالسطر). كل تحليل بيعطي الفترة الحالية وتوقّع للفترة اللي بعدها. ومناطق التحليل بتتغيّر من تحليل لتحليل، فكل منطقة إلها سلسلة لحالها؛ والمناطق المدموجة (المحافظات الشمالية، أو دير البلح مع خان يونس) مش محافظة وحدة. وبتحليل أيار 2024 الملف سمّى المنطقتين المدموجتين «شمال غزة» و«دير البلح»، بس عدد سكانهم بيبيّن إنهم المناطق المدموجة، وهيك محطوطين. والمرحلة 5 على مستوى المنطقة هي الكارثة؛ أما المجاعة فبتعلنها لجنة مراجعة المجاعة التابعة للتصنيف."
    - when: {equals: "ipc.population_analysed_deir_al_balah_projected"}
      name_en: "People analysed in Deir al-Balah, projected for the period beginning on this date (IPC)"
      name_ar: "السكان المشمولون بالتحليل في دير البلح، متوقّع للفترة التي تبدأ بهذا التاريخ (التصنيف المرحلي IPC)"
      concept: food.security
      measure_kind: stock
      grain: period
      place_grain: governorate
      canonical_unit: persons
      serve_warning: "An IPC acute food insecurity analysis for the Gaza Strip (National IPC Technical Working Group, via HDX): the people estimated in each phase over the analysis's period, dated by the period's first day (its last day is in the row, with the analysis's month). Each analysis states the current period and a projection for the next. IPC's areas change between analyses, so each area is a series of its own; combined areas (the northern governorates, Deir al-Balah with Khan Younis) are never one governorate. In the May 2024 analysis the file names its combined areas \"North Gaza\" and \"Deir Al-Balah\"; their populations show they are the combined areas, and they are held as such. Phase 5 at area level is catastrophe; famine is declared for an area by IPC's Famine Review Committee. This is the analysis's PROJECTION for the period: what IPC expected, not what it measured."
