      name_ar: "نسبة الناس في المرحلة 2 (الضغط) من المشمولين بالتحليل في دير البلح وخان يونس، في الفترة التي تبدأ بهذا التاريخ، نسبة مئوية (التصنيف المرحلي IPC)"
      concept: food.security
      measure_kind: ratio
      grain: period
      place_grain: region
      canonical_unit: percent
      serve_warning: "An IPC acute food insecurity analysis for the Gaza Strip (National IPC Technical Working Group, via HDX): the people estimated in each phase over the analysis's period, dated by the period's first day (its last day is in the row, with the analysis's month). Each analysis states the current period and a projection for the next. IPC's areas change between analyses, so each area is a series of its own; combined areas (the northern governorates, Deir al-Balah with Khan Younis) are never one governorate. In the May 2024 analysis the file names its combined areas \"North Gaza\" and \"Deir Al-Balah\"; their populations show they are the combined areas, and they are held as such. Phase 5 at area level is catastrophe; famine is declared for an area by IPC's Famine Review Committee."
