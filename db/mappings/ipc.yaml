      name_ar: "نسبة الناس في المرحلة 4 (الطوارئ) من المشمولين بالتحليل في خان يونس، متوقّع للفترة التي تبدأ بهذا التاريخ، نسبة مئوية (التصنيف المرحلي IPC)"
