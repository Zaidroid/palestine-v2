# OCHA oPt's record of Palestinians killed by Israelis, by month (2026-10-14). ops/fetch_ocha_monthly.py reads
# the casualty report's incident table nightly (one grouped query through the public API the embed calls;
# the victims' names are never asked for) into data/raw/ocha/fatalities_monthly.json: by area, perpetrator,
# age, the victim's affiliation and governorate, January 2008 to this month, each split checked against the
# month's total. Gaza's dead since 7 October 2023 are not in OCHA's record. 6102 records on 2026-10-14.
category: ocha_monthly
transform: engine
v1_category: casualties
shape: observation
status: reviewed
records_measured: 6102
input:
  root: data/raw/ocha
  glob: fatalities_monthly.json
cadence: daily
source_routing:
  by_name:
    "UN OCHA oPt — Data on Casualties": ocha_casualties
datasets:
  - key: ocha_fatalities_monthly
    source: ocha_casualties      # OCHA's terms of use (non-commercial, no redistribution), graded in 042
indicator:
  template: "ocha_monthly.{measure}"
value:
  num_from: value
  text_from: null
  unit_from: unit                # persons
occurred_at:
  from: date
  precision: month
place:
  strategy: governorate
  name_from: location.governorate
  fallback: [region, none]
  min_decided_pct: 1.0
attrs_passthrough: [partial_month]
stable_id: stable_id             # ocha_monthly:<measure>:<month>
identity:
  fields: [indicator, occurred_at]
expect:
  min_records: 5000
  max_observations: 12000        # 6102 on 2026-10-14; 27 a month
registry:
  max_unclassified: 0
  rules:
    - when: {equals: "ocha_monthly.killed"}
      name_en: "Palestinians killed by Israelis in the month (OCHA)"
      name_ar: "الفلسطينيون الذين قتلهم إسرائيليون خلال الشهر (أوتشا)"
      concept: mortality.conflict
      measure_kind: flow
      polarity: -1
      grain: month
      place_grain: region
      canonical_unit: persons
      serve_warning: "OCHA oPt's verified record of Palestinians killed by Israelis (military forces, non-military security forces such as police, settlers, civilians), counted by the month of death from its incident table, January 2008 on. Gaza's dead since 7 October 2023 are NOT in it: OCHA records them only once verified, so its Gaza figures end in 2023 and a month after that is the West Bank and Israel only. A month with none recorded is 0; the newest month is partial."
      serve_warning_ar: "هاد سجل مكتب الأمم المتحدة لتنسيق الشؤون الإنسانية (أوتشا) الموثّق للفلسطينيين اللي قتلهم إسرائيليون (جيش، قوات أمن غير عسكرية زي الشرطة، مستوطنين، مدنيين)، معدودين حسب شهر الوفاة من جدول الحوادث، من كانون الثاني 2008. شهداء غزة من 7 تشرين الأول 2023 مش فيه: أوتشا ما بتسجّلهم إلا بعد التوثيق، فأرقام غزة بتوقف ب2023 وأي شهر بعدها هو للضفة وإسرائيل بس. الشهر اللي ما فيه أحد مسجّل صفر، وآخر شهر ناقص."
    - when: {equals: "ocha_monthly.killed_armed_group_members"}
      name_en: "Palestinians killed by Israelis whom OCHA records as members of armed groups, in the month (OCHA)"
      name_ar: "الفلسطينيون الذين قتلهم إسرائيليون وتسجّلهم أوتشا أعضاء في جماعات مسلحة، خلال الشهر (أوتشا)"
