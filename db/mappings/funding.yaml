# funding — 9,986 humanitarian funding flows from UN OCHA's Financial Tracking
# Service, 2013-05-27 → 2026-08-03. One record = one contribution from one
# donor to one recipient, with an amount in USD. Audit: 100% dated, 0.5%
# year-bucket, 0% lat/lon, precision='country' on all 9,986, one source, one
# license, one unit. The hard question here is not dates or geography — it is
# what the INDICATOR is when every row is a unique transaction.
category: funding
transform: engine
shape: observation
status: reviewed
records_measured: 9986

# CUT FROM v1, 2026-10-12. ops/fetch_fts.py asks FTS's public API the question
# v1 asked (countryISO3=PSE, one request series per usage year from 2015 to
# the current year) and writes the record this spec reads. Measured that day
# against v1's file of the same night: the same 10,341 flow ids, 10,340
# identical on every field the loader reads, 1 revised by FTS twelve hours
# after v1 fetched it. The window is v1's and is not the whole of FTS: a flow
# FTS removes from that answer stays held (see `identity.revises_by` below).
# Rows are matched on the identity, not the stable id: a fetched record's id is
# `fts-flow-<FTS flow id>`, a held row keeps v1's hash until FTS revises it.
# The fallback is v1's file of 2026-10-12, read only where the fetcher has
# never run; a fallback run adds, it never supersedes or closes.
input:
  root: data/raw/fts
  glob: flows.json
  fallback:
    root: data/frozen
    glob: funding.json.gz
cadence: daily

source_routing:
  by_name:
    "UN OCHA Financial Tracking Service": unfts   # exact licenses.json alias
  default: null           # measured: 0 records with sources: []

datasets:
  - key: v1_funding_unfts
    source: unfts

indicator:
  template: "funding.{funding.series|funding.status}"
  # `funding.series` is written by ops/fetch_fts.py: the flow's status (paid /
  # commitment / pledge), or `parked_parent` for a parked contribution with
  # nothing left on it, whose money is on its child flows (see notes, PARKED
  # PARENTS). v1's frozen file (the fallback) has no `series` and reads its
  # status, as it always did.
  # measured 2026-10-13, 10,375 records: paid 7,314 · commitment 2,471 ·
  # pledge 36 · parked_parent 554.
  # See notes for why status and not donor, cluster, plan or appeal.

value:
  num_from: funding.amount_usd   # equals metrics.value on 9,986/9,986 (verified)
  text_from: null
  unit_from: metrics.unit        # 'USD' on 9,986/9,986 — true, unlike most of
                                 #   v1's unit fields

occurred_at:
  from: date
  precision: day
  rules: []                      # DELIBERATELY EMPTY — see notes. Neither
                                 #   law 1 nor law 2 fires here, and the
                                 #   reasoning is written out rather than
                                 #   assumed.

place:
  strategy: region
  # measured: location.precision == 'country' on 9,986/9,986.
  # location.region: 'Palestine' 9,982 → place_id NULL + attrs.region
  #                  'West Bank'     4 → place 2
  min_decided_pct: 1.0

stable_id: stable_id             # 9,986 distinct / 9,986; 1:1 with
                                 #   funding.flow_id (also 9,986 distinct)
attrs_passthrough:
  - funding.flow_id              # FTS's own key — the join back to fts.unocha.org
  - funding.donor                # {name, type}; 330 distinct donors
  - funding.recipient            # {name, type}; 404 distinct recipients
  - funding.cluster              # 8,298/9,986 (83%); 23 real values
  - funding.plan                 # 7,974/9,986 (80%); 16 appeals
  - funding.emergency            # 4,541/9,986 (45%); 3 emergencies
  - funding.flow_type            # Standard 8,593 · Parked 730 ·
                                 #   Pass through 600 · Carryover 63
  - funding.contribution_type    # financial 9,444 · in kind 542
  - funding.method               # Traditional aid 9,469 · CTP 514 · null 3
  - funding.status
  - funding.new_money            # true 8,181 · false 1,805
  - funding.original_amount
  - funding.original_currency    # USD 4,511 · EUR 2,455 · KWD 699 · CHF 339 ·
                                 #   NOK 308 · SEK 251 · …
  - funding.usage_years          # 1 year 9,851 · 2 years 76 · 3+ 59
  - funding.ref_code
  # filled on a parked parent only (None, so absent, on every other row):
  - funding.child_flow_count     # how many child flows FTS lists for it
  - funding.child_flow_ids       # their flow ids, when there are 30 or fewer
                                 #   (the longest list on 2026-10-13 has 21)
  - funding.child_flows_fetched  # how many of them are in the same FTS answer;
                                 #   fewer than the count = part of the
                                 #   contribution went outside PSE or the window
  - location.name                # keeps the 50 non-oPt destinations visible

expect:
  min_records: 8980              # 0.9 × 9,986
  max_observations: 11500

notes: |
  WHAT THE INDICATOR IS. There is no repeating indicator code in this data:
  funding.flow_id is unique on 9,986/9,986 rows, so every record is its own
  event and nothing recurs. The identity has to come from a classifying field
  that is 100% filled, or the template produces literal 'None' strings. Fill
  rates, measured:
    status              9,986/9,986  (paid / commitment / pledge)
    flow_type           9,986/9,986  (Standard / Parked / Pass through / Carryover)
    contribution_type   9,986/9,986  (financial / in kind)
    donor.name          9,986/9,986  (330 distinct)
    cluster             8,298/9,986  (83% — 1,688 nulls)
    plan                7,974/9,986  (80% — 2,012 nulls)
    emergency           4,541/9,986  (45% — 5,445 nulls)
  status wins: it is complete, it has three values, and the three sum to
  something a user actually asks for — pledged vs committed vs actually paid,
  which is the single most-quoted gap in Palestine humanitarian financing.
  Donor (330 values) would produce 330 indicators and belongs in attrs as a
  filter dimension, not in the indicator name; cluster and plan are the most
  useful facets but are 17% and 20% null and would mint 'funding.None'.
  OPEN QUESTION for review: a flatter alternative — one indicator,
  'funding.flow', with status in attrs — reads cleaner and makes 'total
  funding' a single SUM. This spec chose three indicators because summing
  pledges together with payments is the mistake the FTS data most invites.

  WHY rules IS EMPTY, WRITTEN OUT SO NOBODY RE-ADDS THEM.
  Law 1 (ingest masquerade): cannot even be evaluated from the audit. There is
  no metadata.json in the funding directory (verified), so the audit's
  fetch_day is '' and ingest_masquerade_pct is 0.0 by vacuum, not by
  measurement — the same blind spot as `pcbs`. Checked directly instead: the
  dates span 2013-05-27 to 2026-08-03 and cluster on real reporting days
  (-07-21 on 260 rows, -12-29 on 253, -01-22 on 172, -06-08 on 143). These are
  FTS decision dates, not a stamp. Law 1 does not fire.
  Law 2 (year buckets): 54 rows are dated -12-31 (0.5%) and 234 are dated
  -01-01 (2.3%). Law 2's condition is '-12-31 AND event_type is an aggregate'.
  event_type is 'humanitarian_funding' on 9,986/9,986 and every row is one
  transaction, not an annual total — a 31 December disbursement is a real and
  extremely common thing in donor finance. Truncating them to year precision
  would destroy true day-level facts to satisfy a rule written for a different
  shape. Law 2 does not fire.
  If a reviewer disagrees about the 234 -01-01 rows, the measurement to run is
  whether their funding.usage_years matches the stamped year; this spec did
  not run it and does not guess.

  50 FLOWS DO NOT GO TO PALESTINE. location.name is 'Occupied Palestinian
  Territory' on 9,932 rows, but 50 name somewhere else entirely — Lebanon 13,
  Jordan 6, Yemen 5, Afghanistan 5, Sudan 3, Ukraine 3, Algeria 2, Nigeria 2,
  Ethiopia 2, Italy 1, and others — while still carrying
  location.region = 'Palestine'. They are in a PSE-filtered FTS pull because
  the donor or the recipient touches the oPt portfolio, not because the money
  landed in Palestine. Under strategy: region they all get place_id NULL,
  which is the honest outcome, and location.name is passed through so the 50
  stay visible rather than silently becoming "Palestine funding". OPEN
  QUESTION: should they be excluded from the dataset rather than carried with
  a NULL place? That is a scope call about what "Palestine funding" means.
  Four other rows carry region='West Bank' and do resolve, to place 2.

  SHAPE: observation, NOT event. Each row is a dated transaction, which reads
  like an event, but README reserves `shape: event` for conflict and
  demolitions — things that happen at a place and time and have casualties.
  A funding flow measures an amount, has no place finer than 'country', and
  belongs on the observation timeline next to the indicators it pays for.

  LICENSE IS CLEAN AND SELLABLE. One source × license pair on all 9,986 rows:
  UN OCHA Financial Tracking Service :: CC-BY-IGO-3.0, matching 042's `unfts`
  (commercial_use=true, authority_rank 4). No verify-required rows, no mixed
  licenses, no unroutable names. This is the largest unambiguously sellable
  dataset in the Tier-2 set.

  metrics.count is the literal 1 on essentially every row and metrics.value
  duplicates funding.amount_usd exactly (9,986/9,986 verified). value_num
  reads funding.amount_usd because that is the field the FTS API actually
  populates; metrics.value is v1's copy of it.

  PARKED PARENTS (2026-10-13). FTS "parks" a contribution on a parent flow and
  files its allocations as child flows. The parent's amountUSD is what is left
  on it; fullParkedAmountUSD is the whole. Until this date a parent with
  nothing left (amountUSD 0) was a row of its status series carrying the whole
  parked amount, beside the children that carry the same money: 520 parents,
  USD 1,926,516,664 (paid 397 / 1,110,621,301 · commitment 122 / 815,837,426 ·
  pledge 1 / 57,937), measured on the answer of 2026-10-13.
  Now such a parent is one row of `funding.parked_parent`: the whole parked
  amount, the date, place and attrs it always had, plus child_flow_count,
  child_flow_ids and child_flows_fetched. It is kept so the contribution can be
  seen and followed to its children. IT IS NEVER ADDED TO paid, commitment OR
  pledge, and the registry rule below says so beside every answer.
  The fetcher decides (ops/fetch_fts.py, `is_parked_parent`), because only it
  sees both of FTS's amounts; it writes the decision as `funding.series`.
  - A parent whose remainder is BELOW zero (FTS shows more allocated to its
    children than was parked; 34 on 2026-10-13, USD 596,778,654 parked) is a
    parked parent too.
    v1 dropped such a flow, and a row held from a night when its remainder was
    still positive then stayed in its status series for ever (3 rows,
    USD 17,099,866 on 2026-10-13: flows 291050, 292049, 390239).
  - A partly allocated parent (231 on 2026-10-13) keeps its REMAINDER under
    its status. Measured: 117 have no child yet and carry the whole amount;
    of the 114 with children, 99 have every child in the answer, and
    remainder + children = the parked amount, to the dollar, on all 99.
  - 28 of the 554 parents have a child that is not in the answer. Such a
    child's money is not in a status series: FTS files it under another
    country or under no country, or under a usage year the window has not
    reached (8 children of usage year 2027, USD 11,195,842, on 2026-10-13;
    they enter on 1 January 2027).
  - v1's frozen file (the fallback) keeps only the amount v1 chose, so a
    fallback run cannot tell a parked parent and files it under its status.
  The held rows close through `identity.revises_by` below: the parent's flow
  number comes back under `funding.parked_parent`, so its older reading under
  funding.<status> is closed, never deleted.

identity:
  # UN FTS flows carry their own flow_id, which is the honest key — two
  # grants to the same recipient on the same day are two grants.
  fields: [indicator, occurred_at, place_id]
  attrs: [flow_id]                                     # = 9,991 / 9,991 ✓
  # FTS REVISES A FLOW IN PLACE AND KEEPS ITS NUMBER (2026-10-11). The key
  # above holds the status (the indicator) and the decision date, so a flow
  # that moved from commitment to paid, or whose date was corrected, became a
  # second current row: 26 flows twice inside `paid` ($97.3 M), 27 inside
  # `commitment` ($103.7 M), 17 live as both. `revises_by` closes the older
  # reading the night the flow reappears under its new key. It does not close
  # a flow the file no longer carries: v1's file is a window (841 of 10,185
  # held rows were absent from it on 2026-09-26), so that stays `window`.
  revises_by: flow_id

registry:
  max_unclassified: 0
  rules:
    # FIRST, or the prefix rule below would file the parked parents with the
    # money that may be added up.
    - when: {equals: "funding.parked_parent"}
      concept: funding.humanitarian
      measure_kind: flow         # dated amounts; see the warning for what
                                 #   they must never be added to
      grain: event
      place_grain: region
      canonical_unit: USD
      # Served when it is asked for by name (migration 114; Zaid, 2026-10-13):
      # a parked parent is dated like any flow, so the newest rows of `funding`
      # could be parents, and the spoken answer then led with a contribution
      # whose money is already counted under its children. The category
      # answers with paid, commitment and pledge and says this series is held.
      ask_by_name: true
      serve_warning: "A contribution that UN OCHA's Financial Tracking Service parked on a parent flow and has since allocated in full. The row shows the whole contribution, and the same money is already counted in its child flows under paid, commitment or pledge: never add this series to those. Some child flows are outside this databank (another country, no country, or a usage year not reached yet); child_flows_fetched beside child_flow_count says how many are here."
      serve_warning_ar: "هاي مساهمة سجّلتها خدمة التتبّع المالي (أوتشا) كتحويل أصلي ووزّعتها كلها على تحويلات فرعية. السطر بيعرض المساهمة كاملة، ونفس المبلغ محسوب أصلاً في تحويلاتها الفرعية تحت المدفوع أو الالتزام أو التعهّد: ما بتنجمع مع هاي السلاسل أبداً. وبعض التحويلات الفرعية خارج هاي القاعدة (لبلد ثاني، أو بدون بلد، أو لسنة استخدام ما وصلناها بعد)، والرقم child_flows_fetched جنب child_flow_count بيقول كم واحد منها موجود هون."
    - when: {prefix: "funding."}
      concept: funding.humanitarian
      measure_kind: flow         # money moving, summable over a period
      polarity: 1
      grain: event
      place_grain: region
      canonical_unit: USD
