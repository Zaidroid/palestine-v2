      measure_kind: ratio
      grain: year
      place_grain: region
      canonical_unit: percent
    - when: {regex: "^economic\\.(sh|sh_sta|sh_dyn)_", unit: [per_1000, per_100000, births_per_woman]}
      concept: health.outcome
      measure_kind: rate
      grain: year
      place_grain: region
    - when: {regex: "^economic\\.(sh|sh_sta|sh_dyn)_", unit: [index, ratio]}
      concept: health.outcome
      measure_kind: index
      grain: year
      place_grain: region
    - when: {regex: "^economic\\.(sh|sh_sta|sh_dyn)_", unit: [number, count, persons, years, currency_usd, USD]}
      concept: health.outcome
      measure_kind: stock
      grain: year
      place_grain: region
    - when: {regex: "^economic\\.(sh|sh_sta|sh_dyn)_"}
      concept: health.outcome
      measure_kind: unclassified
      grain: year
      place_grain: region
      note: >-
        SH.* health outcomes. Concept is known; the unit is absent or unrecognised so the
        KIND of number is not. /correlate refuses an unclassified kind by
        design — a series nobody has established the kind of is one nobody
        should plot against another.
