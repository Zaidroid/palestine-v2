# Prices in Gaza's markets, from the Gaza Chamber of Commerce and Industry's weekly "Gaza Movement of
# Goods" reports (2026-10-14). The reports are in the archive whole (source org:gazacham, read by
# ops/fetch_gazacham.py); ops/build_gazacham_prices.py reads their price tables into
# data/raw/gazacham/prices.json, each row checked against its own percent columns:
#   - 31 goods, the week's average price beside the pre-war price: the whole Strip from week 27
#     (28 January 2025) to week 111 (13 September 2026), and the north and the south apart in weeks
#     5-26 (August 2024 to January 2025) and 62-65 (October 2025); the box of bottled water from the
#     early reports only;
#   - the weeks a table printed NA for a good in place of a price, as a mark of their own;
#   - the Chamber's price index (GCPI): 447 days, the index's weeks (1-13 as the basket's cost in the
#     north and the south, 14-27 for the Strip), 19 months, each as the index and as the cost.
# 3809 figures on 2026-10-14. Rows before week 36 state no unit: a good takes the later tables'
# unit for the same pre-war price, or the report's own pre-war price where the unit is not in doubt.
# Weeks 1-4 are not read: their one daily table names no region, and the north then paid up to ten
# times the south. The rows a report prints that do not add up are listed in the file's metadata.
category: price_gazacham
transform: engine
v1_category: food                # beside WFP's monthly prices, never merged with them
shape: observation
status: reviewed
records_measured: 3809
input:
  root: data/raw/gazacham
  glob: prices.json
cadence: irregular               # a report every two weeks since July 2025
source_routing:
  by_name:
    "Gaza Chamber of Commerce and Industry — Gaza Movement of Goods weekly reports": gaza_chamber
datasets:
  - key: gazacham_prices
    source: gaza_chamber         # migration 118: all rights reserved, held for the house
indicator:
  template: "price_gazacham.{measure}"
value:
  num_from: value
  text_from: text                # "NA" on the *_unpriced rows, nothing else
  unit_from: unit                # ILS/KG · ILS/25 KG · ILS/L · ILS/400 G · ILS/PIECE · ILS/10 PIECES · ILS/40 PIECES · index · ILS
occurred_at:
  from: date                     # a day, or a week's or a month's first day; its last is attrs.period_end
  precision: day
  rules:
    - when: {op: present, field: precision}
      then: {precision_from: precision}   # "month" on the index's monthly rows, "day" on the others
place:
  strategy: region               # every record: region = 'Gaza Strip'
  min_decided_pct: 1.0
attrs_passthrough: [period_start, period_end, week, index_week, prewar_price, stated_change_vs_prewar_pct,
                    prewar_basket, name_printed, unit_printed, report, market, basis, daily_table_average]
stable_id: stable_id             # gazacham:prices:week<NNN>:<good> · gazacham:prices:<measure>:<date>
identity:
  fields: [indicator, occurred_at]
expect:
  min_records: 3500
  max_observations: 5000         # 3,809 on 2026-10-14; a report adds about 90
registry:
  max_unclassified: 0
  rules:
    - when: {equals: "price_gazacham.apple"}
      name_en: "Average price of apple in Gaza's markets in the week beginning on this date, ILS per kg (Gaza Chamber of Commerce)"
      name_ar: "متوسط سعر تفاح في أسواق قطاع غزة في الأسبوع الذي يبدأ بهذا التاريخ، بالشيكل للكيلوغرام (غرفة تجارة وصناعة غزة)"
      concept: food.price
      measure_kind: stock
      polarity: -1
      grain: period
      place_grain: region
      canonical_unit: ILS_per_kg
      serve_warning: "A week's average of the prices the Gaza Chamber of Commerce recorded in Gaza's markets, dated by the week's first day (its last day is in the row), in the unit the Chamber prices the good in; each row also carries the pre-war price the report compares it with (prewar_price). The reports price the Strip as one market from week 27 (28 January 2025); before that, and in weeks 62 to 65 (October 2025), they priced the north and the south apart, which are series of their own. Rows before week 36 state no unit: theirs is the later tables' for the same pre-war price (the row's basis says so). Not WFP's monthly retail price: never one series."
      serve_warning_ar: "هاد معدّل أسعار أسبوع سجّلتها غرفة تجارة غزة بأسواق القطاع، مأرّخ بأول يوم بالأسبوع وآخر يوم مكتوب بالسطر، وبالوحدة اللي الغرفة بتسعّر فيها؛ وكل سطر فيه كمان سعر ما قبل الحرب اللي التقرير بيقارن فيه. التقارير بتسعّر القطاع كسوق واحد من الأسبوع 27 (28 كانون الثاني 2025)؛ قبلها، وبالأسابيع 62 لـ65 (تشرين الأول 2025)، سعّرت الشمال والجنوب كل وحدة لحال، وإلهم سلاسل لحالهم. السطور قبل الأسبوع 36 ما بتكتب الوحدة: وحدتها هي وحدة الجداول اللاحقة لنفس سعر ما قبل الحرب (والسطر بيقول هيك). وهاد مش سعر برنامج الأغذية العالمي الشهري، وما بنحطهم بسلسلة وحدة."
    - when: {equals: "price_gazacham.apple_north"}
      name_en: "Average price of apple in the northern part of the Gaza Strip in the week beginning on this date, ILS per kg (Gaza Chamber of Commerce)"
      name_ar: "متوسط سعر تفاح في شمال قطاع غزة في الأسبوع الذي يبدأ بهذا التاريخ، بالشيكل للكيلوغرام (غرفة تجارة وصناعة غزة)"
      concept: food.price
      measure_kind: stock
      polarity: -1
      grain: period
      place_grain: region
      canonical_unit: ILS_per_kg
      serve_warning: "A week's average of the prices the Gaza Chamber of Commerce recorded in the northern part of the Gaza Strip, dated by the week's first day (its last day is in the row). The reports priced the north and the south apart from August 2024 to January 2025, and again in October 2025, when the north was cut off from the south. The rows state no unit: the unit is the later tables' for the same pre-war price, or, where a report's pre-war price differs and the unit is not in doubt (per kilo or litre), the report's own (the row's basis says which). Where the same report's daily table gives another average, it sits beside the figure (daily_table_average). Not WFP's monthly retail price: never one series."
      serve_warning_ar: "هاد معدّل أسعار أسبوع سجّلتها غرفة تجارة غزة في شمال قطاع غزة، مأرّخ بأول يوم بالأسبوع وآخر يوم مكتوب بالسطر. التقارير سعّرت الشمال والجنوب كل وحدة لحال من آب 2024 لكانون الثاني 2025، ومرة ثانية بتشرين الأول 2025 لما انقطع الشمال عن الجنوب. السطور ما بتكتب الوحدة: الوحدة هي وحدة الجداول اللاحقة لنفس سعر ما قبل الحرب، أو سعر ما قبل الحرب اللي بالتقرير نفسه لما يختلف والوحدة مش موضع شك (للكيلو أو اللتر)، والسطر بيقول أيهم. ولما الجدول اليومي بنفس التقرير يعطي معدّل ثاني، بيكون جنب الرقم. وهاد مش سعر برنامج الأغذية العالمي الشهري."
    - when: {equals: "price_gazacham.apple_north_unpriced"}
      name_en: "Weeks the Gaza Chamber of Commerce's price table printed NA for apple in the northern part of the Gaza Strip in place of a price (week beginning on this date)"
      name_ar: "الأسابيع التي كتب فيها جدول أسعار غرفة تجارة غزة NA مكان سعر تفاح في شمال قطاع غزة (الأسبوع الذي يبدأ بهذا التاريخ)"
      concept: food.price
      measure_kind: status
      grain: period
      place_grain: region
      serve_warning: "The Chamber's price table printed NA for this good in these weeks, in place of a price. The reports do not define NA; their summaries say, in the same weeks, that such goods were no longer found in the markets. A week with no row here is not a week the good was found: it is a week with a price, or with no table."
      serve_warning_ar: "جدول أسعار الغرفة كتب NA لهاي السلعة بهاي الأسابيع بدل السعر. التقارير ما بتعرّف NA؛ بس ملخصاتها بتقول بنفس الأسابيع إن هيك سلع ما عادت موجودة بالأسواق. والأسبوع اللي ما إله سطر هون مش معناه إن السلعة كانت موجودة: معناه إنه إله سعر، أو ما كان فيه جدول."
