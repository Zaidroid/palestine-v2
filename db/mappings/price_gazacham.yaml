      name_ar: "متوسط سعر باذنجان في جنوب قطاع غزة في الأسبوع الذي يبدأ بهذا التاريخ، بالشيكل للكيلوغرام (غرفة تجارة وصناعة غزة)"
      concept: food.price
      measure_kind: stock
      polarity: -1
      grain: period
      place_grain: region
      canonical_unit: ILS_per_kg
      serve_warning: "A week's average of the prices the Gaza Chamber of Commerce recorded in the south of the Gaza Strip, dated by the week's first day (its last day is in the row). The reports priced the north and the south apart from August 2024 to January 2025, and again in October 2025, when the north was cut off from the south. The rows state no unit: the unit is the later tables' for the same pre-war price, or, where a report's pre-war price differs and the unit is not in doubt (per kilo or litre), the report's own (the row's basis says which). Where the same report's daily table gives another average, it sits beside the figure (daily_table_average). Not WFP's monthly retail price: never one series."
      serve_warning_ar: "هاد معدّل أسعار أسبوع سجّلتها غرفة تجارة غزة في جنوب قطاع غزة، مأرّخ بأول يوم بالأسبوع وآخر يوم مكتوب بالسطر. التقارير سعّرت الشمال والجنوب كل وحدة لحال من آب 2024 لكانون الثاني 2025، ومرة ثانية بتشرين الأول 2025 لما انقطع الشمال عن الجنوب. السطور ما بتكتب الوحدة: الوحدة هي وحدة الجداول اللاحقة لنفس سعر ما قبل الحرب، أو سعر ما قبل الحرب اللي بالتقرير نفسه لما يختلف والوحدة مش موضع شك (للكيلو أو اللتر)، والسطر بيقول أيهم. ولما الجدول اليومي بنفس التقرير يعطي معدّل ثاني، بيكون جنب الرقم. وهاد مش سعر برنامج الأغذية العالمي الشهري."
    - when: {equals: "price_gazacham.eggs"}
      name_en: "Average price of eggs in Gaza's markets in the week beginning on this date, ILS per kg (Gaza Chamber of Commerce)"
