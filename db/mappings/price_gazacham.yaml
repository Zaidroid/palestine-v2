      concept: food.price
      measure_kind: stock
      polarity: -1
      grain: period
      place_grain: region
      canonical_unit: ILS_per_kg
      serve_warning: "A week's average of the prices the Gaza Chamber of Commerce recorded in Gaza's markets, dated by the week's first day (its last day is in the row), in the unit the Chamber prices the good in; each row also carries the pre-war price the report compares it with (prewar_price). The reports price the Strip as one market from week 27 (28 January 2025); before that, and in weeks 62 to 65 (October 2025), they priced the north and the south apart, which are series of their own. Rows before week 36 state no unit: theirs is the later tables' for the same pre-war price (the row's basis says so). Not WFP's monthly retail price: never one series."
      serve_warning_ar: "هاد معدّل أسعار أسبوع سجّلتها غرفة تجارة غزة بأسواق القطاع، مأرّخ بأول يوم بالأسبوع وآخر يوم مكتوب بالسطر، وبالوحدة اللي الغرفة بتسعّر فيها؛ وكل سطر فيه كمان سعر ما قبل الحرب اللي التقرير بيقارن فيه. التقارير بتسعّر القطاع كسوق واحد من الأسبوع 27 (28 كانون الثاني 2025)؛ قبلها، وبالأسابيع 62 لـ65 (تشرين الأول 2025)، سعّرت الشمال والجنوب كل وحدة لحال، وإلهم سلاسل لحالهم. السطور قبل الأسبوع 36 ما بتكتب الوحدة: وحدتها هي وحدة الجداول اللاحقة لنفس سعر ما قبل الحرب (والسطر بيقول هيك). وهاد مش سعر برنامج الأغذية العالمي الشهري، وما بنحطهم بسلسلة وحدة."
