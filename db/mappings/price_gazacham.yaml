    - when: {equals: "price_gazacham.basket_cost_weekly_north"}
      name_en: "Cost in shekels of the Gaza Chamber of Commerce's basket of essential goods in the northern part of the Gaza Strip, in the index's week beginning on this date (pre-war: ILS 92.44)"
      name_ar: "كلفة سلة السلع الأساسية لغرفة تجارة غزة بالشيكل في شمال قطاع غزة، بأسبوع المؤشر اللي بيبلّش بهاد التاريخ (قبل الحرب: 92.44 شيكل)"
      concept: economy.prices
      measure_kind: stock
      polarity: -1
      grain: period
      place_grain: region
      canonical_unit: ILS
      serve_warning: "The index's own weeks 1 to 13, 1 November 2024 to 30 January 2025, when the Chamber measured its basket (rice 1.38 kg, vegetable oil 1.37 l, sugar 1 kg, flour 12.65 kg, tomato 3.5 kg, cucumber 3.45 kg, onion 3.5 kg, potato 2.5 kg, soap, sanitary towels, washing liquid and dishwashing liquid) for the north and the south apart. The report's table heads these columns 'index value', but the numbers are the basket's cost in shekels: the north's 2,524.69 is 2,731% of the pre-war 92.44, the '2,732%' the same report's text gives."
      serve_warning_ar: "هاي أسابيع المؤشر من 1 لـ13، من 1 تشرين الثاني 2024 لـ30 كانون الثاني 2025، لما الغرفة قاست سلتها (أرز 1.38 كغم، زيت 1.37 لتر، سكر 1 كغم، طحين 12.65 كغم، بندورة 3.5 كغم، خيار 3.45 كغم، بصل 3.5 كغم، بطاطا 2.5 كغم، صابون، فوط صحية، سائل غسيل وسائل جلي) للشمال والجنوب كل وحدة لحال. جدول التقرير بيكتب فوق العمودين 'قيمة المؤشر'، بس الأرقام هي كلفة السلة بالشيكل: 2,524.69 للشمال هي 2,731% من 92.44 قبل الحرب، وهي الـ'2,732%' اللي نص التقرير نفسه بيعطيها."
