      serve_warning_ar: "هاد عدّ شهري من نظام منظمة الصحة العالمية لرصد الهجمات على الرعاية الصحية (SSA) بالأرض الفلسطينية المحتلة: الهجمات اللي سجّلتها المنظمة، حسب شهر الهجوم. المنظمة ما بتفصل بين الضفة وغزة وما بتعطي مكان أصغر من الأرض المحتلة. وهاي الهجمات على الرعاية الصحية زي ما بتعرّفها المنظمة، مش كل عامل صحي أو مستشفى انضرّ بالحرب: وزارة الصحة وغيرها بيعدّوا بطريقة ثانية. والمنظمة ممكن تسحب أي سجل بأي وقت، فممكن رقم الشهر ينزل. وآخر شهر ناقص لحد ما يخلص. الهجوم الواحد ممكن يصيب أو يحمل أكثر من وحدة من هدول مرة وحدة: بينعدّ تحت كل وحدة، فمجموعهم مش هو عدد الهجمات."
